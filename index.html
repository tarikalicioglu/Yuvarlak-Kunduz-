<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kunduz Top</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5fb2ea">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kunduz Top">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;font-family:'Baloo 2',system-ui,sans-serif;
    background:linear-gradient(#5fb2ea 0%,#9fd3f3 55%,#e3f3fb 100%);transition:background .6s;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;touch-action:none}
  .hidden{display:none!important}
  #hud{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;pointer-events:none;color:#fff;
    font-weight:800;font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
  #hudRow{display:flex;justify-content:space-between;align-items:center;gap:6px}
  .pill{background:rgba(0,0,0,.25);padding:1px 12px;border-radius:999px;white-space:nowrap}
  #bar{margin-top:8px;height:10px;border-radius:999px;background:rgba(0,0,0,.2);overflow:hidden}
  #barFill{height:100%;width:0;background:linear-gradient(90deg,#ffcf3f,#ff8fb1);border-radius:999px}
  #toast{position:fixed;top:22%;left:0;right:0;text-align:center;color:#fff;font-weight:800;font-size:34px;line-height:1.15;
    text-shadow:0 4px 0 rgba(0,0,0,.3);pointer-events:none;opacity:0;transition:opacity .3s;padding:0 16px}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#fff;text-align:center;padding:24px;box-sizing:border-box}
  .dim{background:rgba(25,45,85,.5)}
  #menu{justify-content:space-between;padding-top:calc(36px + env(safe-area-inset-top));
    padding-bottom:calc(36px + env(safe-area-inset-bottom));
    background:linear-gradient(rgba(25,45,85,.35),rgba(25,45,85,0) 30%,rgba(25,45,85,0) 62%,rgba(25,45,85,.45))}
  h1{font-size:58px;margin:0;line-height:1;text-shadow:0 5px 0 rgba(0,0,0,.25)}
  h2{font-size:40px;margin:0;line-height:1.1;text-shadow:0 4px 0 rgba(0,0,0,.25)}
  .sub{font-size:19px;margin:8px 0 0;line-height:1.3;text-shadow:0 2px 0 rgba(0,0,0,.25)}
  .btns{display:flex;flex-direction:column;gap:12px;align-items:center}
  .big{font-family:inherit;font-weight:800;font-size:26px;border:none;border-radius:999px;padding:10px 40px;
    background:#ffcf3f;color:#6a4319;box-shadow:0 6px 0 #c9971a;cursor:pointer;min-width:220px}
  .big:active{transform:translateY(4px);box-shadow:0 2px 0 #c9971a}
  .big.alt{background:#fff;color:#2b5d8a;box-shadow:0 6px 0 #b9cfe2}
  .small{font-family:inherit;font-weight:800;font-size:15px;border:none;border-radius:999px;padding:4px 14px;
    background:rgba(0,0,0,.28);color:#fff;cursor:pointer}
  .stats{font-size:24px;margin:10px 0 20px}
  .stars{font-size:46px;letter-spacing:4px;color:#ffe07a;text-shadow:0 3px 0 rgba(0,0,0,.25)}
  .stars .off{color:rgba(255,255,255,.35)}
  #levels{background:rgba(25,55,100,.92);justify-content:flex-start;padding-top:calc(20px + env(safe-area-inset-top))}
  #levelsHead{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:520px;margin-bottom:12px}
  #grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:100%;max-width:520px;overflow-y:auto;
    padding:4px 4px 30px;box-sizing:border-box;touch-action:pan-y;-webkit-overflow-scrolling:touch;flex:1;align-content:start}
  .wh{grid-column:1/-1;text-align:left;font-size:22px;font-weight:800;margin:8px 0 0;text-shadow:0 2px 0 rgba(0,0,0,.25)}
  .lv{font-family:inherit;font-weight:800;font-size:22px;border:none;border-radius:16px;aspect-ratio:1;
    background:#ffcf3f;color:#6a4319;box-shadow:0 4px 0 #c9971a;display:flex;flex-direction:column;
    align-items:center;justify-content:center;line-height:1;cursor:pointer;padding:0}
  .lv small{font-size:11px;color:#b5651d;margin-top:3px;letter-spacing:1px}
  .lv.locked{background:rgba(255,255,255,.22);color:rgba(255,255,255,.7);box-shadow:none;cursor:default}
  .lv.cur{outline:4px solid #fff}
</style>
</head>
<body>
<div id="hud" class="hidden">
  <div id="hudRow">
    <span class="pill" id="hLevel">Level 1</span>
    <span class="pill" id="hLives">❤️❤️❤️</span>
    <span class="pill" id="hApples">🍎 0</span>
  </div>
  <div id="bar"><div id="barFill"></div></div>
</div>
<div id="toast"></div>

<div class="overlay" id="menu">
  <div>
    <h1>Kunduz Top</h1>
    <p class="sub" id="menuWorld"></p>
    <p class="sub">Parmağını ekranda <b>sağa sola kaydır</b>,<br>zıplamak için ekrana <b>dokun</b>.</p>
  </div>
  <div class="btns">
    <button class="big" id="playBtn">Oyna</button>
    <button class="big alt" id="levelsBtn">Leveller</button>
    <button class="small" id="muteBtn">Ses: Açık</button>
  </div>
</div>

<div class="overlay hidden" id="levels">
  <div id="levelsHead">
    <button class="small" id="levelsBack">◀ Geri</button>
    <h2 style="font-size:32px">Leveller</h2>
    <span style="width:70px"></span>
  </div>
  <div id="grid"></div>
</div>

<div class="overlay dim hidden" id="win">
  <h2 id="winTitle">Level 1 bitti!</h2>
  <div class="stars" id="winStars"></div>
  <div class="stats" id="winStats"></div>
  <div class="btns">
    <button class="big" id="nextBtn">Sonraki Level</button>
    <button class="big alt" id="winLevelsBtn">Leveller</button>
  </div>
</div>

<div class="overlay dim hidden" id="lose">
  <h2>Canların bitti!</h2>
  <div class="stats">Hiç sorun değil, bir daha dene!</div>
  <div class="btns">
    <button class="big" id="retryBtn">Tekrar Dene</button>
    <button class="big alt" id="loseLevelsBtn">Leveller</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
// =====================================================================
// constants & helpers
// =====================================================================
const L = 4;            // normal tile length
const R = 0.5;          // ball radius
const TH = 0.5;         // road thickness
const G = 24;           // gravity
const JUMP_V = 8.6;     // normal jump (air time ~0.72 s)
const PAD_V = 14;       // trampoline jump
const MAX_LEVEL = 100;
const START_LIVES = 3, MAX_LIVES = 5;

const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// =====================================================================
// save (each phone keeps its own progress)
// =====================================================================
const SAVE_KEY = 'kunduzTop.v1';
function loadSave(){
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.unlocked) return s; } catch(e){}
  return { unlocked: 1, stars: {}, seen: {} };
}
let save = loadSave();
save.seen = save.seen || {};
function writeSave(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch(e){} }

// =====================================================================
// sound
// =====================================================================
let actx = null, muted = false;
function initAudio(){
  if (actx){ if (actx.state === 'suspended') actx.resume().catch(()=>{}); return; }
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ actx = null; }
}
function tone(f1, f2, dur, type, vol, delay){
  if (!actx || muted) return;
  try {
    const t = actx.currentTime + (delay || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur);
    g.gain.setValueAtTime(vol || 0.15, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch(e){}
}
const sfx = {
  jump(){ tone(320, 640, 0.18, 'square', 0.06); },
  pad(){ tone(200, 1200, 0.35, 'sine', 0.16); },
  apple(){ tone(880, 1320, 0.12, 'triangle', 0.14); tone(1320, 1760, 0.1, 'triangle', 0.1, 0.07); },
  heart(){ [784, 988, 1175, 1568].forEach((f,i)=>tone(f, f, 0.14, 'sine', 0.14, i*0.07)); },
  fall(){ tone(500, 90, 0.8, 'sawtooth', 0.07); },
  bonk(){ tone(180, 70, 0.25, 'square', 0.12); },
  curl(){ tone(300, 900, 0.25, 'sine', 0.12); },
  win(){ [523,659,784,1046,1318].forEach((f,i)=>tone(f, f, 0.18, 'triangle', 0.12, i*0.1)); }
};

// =====================================================================
// three setup
// =====================================================================
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfe9f8, 40, 110);
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 400);
const hemi = new THREE.HemisphereLight(0xffffff, 0x8fb3d6, 0.85);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff4e0, 0.75);
sun.position.set(6, 12, 5);
scene.add(sun);
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function canvasTex(w, h, draw, repeat){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (repeat){ t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  return t;
}
const lam = (color, extra) => new THREE.MeshLambertMaterial(Object.assign({ color }, extra || {}));
const basic = (color, extra) => new THREE.MeshBasicMaterial(Object.assign({ color }, extra || {}));
const geoCache = {};
const G_ = (key, make) => geoCache[key] || (geoCache[key] = make());

// =====================================================================
// worlds
// =====================================================================
const WORLDS = [
  { name: 'Bahçe',  emoji: '🌸', sky: ['#6cc3f5','#bfe6fb','#f2fbff'], fog: 0xd8f0fb, hemi: [0xffffff, 0x9ac78a, 0.85], sun: 0.75,
    roads: ['candy','grass','wood'], palette: [0xff8fb1,0xffc94a,0x7fd8a8,0x7cc4ff,0xc5a0ff], ground: 0x7fcf6a, groundY: -34, clouds: 1, decor: 'garden' },
  { name: 'Orman',  emoji: '🌲', sky: ['#5aaee0','#a8dcef','#e3f5e6'], fog: 0xcfe8dc, hemi: [0xffffff, 0x6a9a5a, 0.85], sun: 0.75,
    roads: ['wood','grass','stone'], palette: [0x8fd16a,0xc9a26b,0x6bbf8a,0xe0c070], ground: 0x3f8f4a, groundY: -34, clouds: 1, decor: 'forest' },
  { name: 'Kumsal', emoji: '🏖️', sky: ['#3fb6f0','#9ee0f7','#fff4d6'], fog: 0xf3ecd6, hemi: [0xffffff, 0xe8d3a0, 0.9], sun: 0.8,
    roads: ['sand','wood','candy'], palette: [0xffd27a,0xff9e7a,0x7fd8e8,0xffe9a8], ground: 0x2fa8d8, groundY: -14, clouds: 1, decor: 'beach' },
  { name: 'Deniz',  emoji: '🌊', sky: ['#2f9fe0','#86d0f5','#d9f3ff'], fog: 0xbfe6f7, hemi: [0xffffff, 0x5fb0d0, 0.9], sun: 0.75,
    roads: ['wood','glass','candy'], palette: [0x7fd0ff,0x9ff0e0,0xffffff,0x5fb8ff], ground: 0x1f86c8, groundY: -9, clouds: 1, decor: 'sea' },
  { name: 'Dağ',    emoji: '⛰️', sky: ['#4f9bd8','#a9cfee','#eef5fb'], fog: 0xdde9f3, hemi: [0xffffff, 0x8a9aa8, 0.85], sun: 0.75,
    roads: ['stone','snow','wood'], palette: [0xb8c4d0,0xd8e2ea,0x9fb0be], ground: 0x6f8f6a, groundY: -44, clouds: 1, decor: 'mountain' },
  { name: 'Şehir',  emoji: '🏙️', sky: ['#ff9a6a','#ffc79a','#ffe9d0'], fog: 0xf6d9c4, hemi: [0xfff0e0, 0x8a7a9a, 0.85], sun: 0.7,
    roads: ['highway','stone','glass'], palette: [0x9aa5b5,0xffb07a,0x7fa8d8], ground: 0x5a5f6a, groundY: -44, clouds: 0, decor: 'city' },
  { name: 'Çöl',    emoji: '🌵', sky: ['#f0a84a','#f8d08a','#fff0cc'], fog: 0xf6e2b8, hemi: [0xfff4e0, 0xd8b070, 0.9], sun: 0.8,
    roads: ['sand','stone','highway'], palette: [0xf0c070,0xe0a050,0xf8dca0], ground: 0xe8c27a, groundY: -22, clouds: 0, decor: 'desert' },
  { name: 'Kış',    emoji: '❄️', sky: ['#8fb8dc','#c8def0','#f4f8fc'], fog: 0xe6eef6, hemi: [0xffffff, 0xb8c8d8, 0.9], sun: 0.65,
    roads: ['ice','snow','wood'], palette: [0xd8f0ff,0xffffff,0xa8d8ff], ground: 0xf2f6fa, groundY: -22, clouds: 1, decor: 'winter' },
  { name: 'Uzay',   emoji: '🪐', sky: ['#0b0b2a','#1d1550','#3a1f6a'], fog: 0x1d1550, hemi: [0xc8c0ff, 0x2a2050, 0.95], sun: 0.6,
    roads: ['space','glass','candy'], palette: [0xc58bff,0x7cc4ff,0xff8fd8], ground: null, groundY: 0, clouds: 0, decor: 'space' },
  { name: 'Volkan', emoji: '🌋', sky: ['#2a0c0c','#6a1a10','#c0461a'], fog: 0x6a2410, hemi: [0xffd0b0, 0x602010, 0.9], sun: 0.6,
    roads: ['lavarock','stone','glass'], palette: [0x6a4a44,0x8a5a4a], ground: 0xff5a10, groundY: -16, clouds: 0, decor: 'volcano' }
];
const worldOf = n => WORLDS[Math.min(9, Math.floor((n - 1) / 10))];

// obstacle unlock schedule (level where each type first appears)
const OBST = [
  { type: 'static',  from: 5,  label: 'Engellerden kaç ya da üstünden zıpla!' },
  { type: 'slider',  from: 11, label: 'Yeni: Kayan engeller!' },
  { type: 'hammer',  from: 21, label: 'Yeni: Sallanan çekiçler!' },
  { type: 'roller',  from: 26, label: 'Yeni: Yuvarlanan kütükler!' },
  { type: 'spinner', from: 31, label: 'Yeni: Dönen çubuklar! Zıpla!' },
  { type: 'blink',   from: 41, label: 'Yeni: Kaybolan yollar!' },
  { type: 'mover',   from: 51, label: 'Yeni: Hareketli platformlar!' },
  { type: 'hopper',  from: 91, label: 'Dikkat: Zıplayan lav topları!' }
];

// =====================================================================
// beaver (original design)
// =====================================================================
const FUR = 0xa85a2a, FUR_DARK = 0x7a3f1c, CREAM = 0xf0d6ab, NOSE = 0x4a2717, PAW = 0x5a3020;
const tailTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#5e3b28'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#3e2618'; g.lineWidth = 4;
  for (let k = -w; k < w*2; k += 22){
    g.beginPath(); g.moveTo(k, 0); g.lineTo(k + h, h); g.stroke();
    g.beginPath(); g.moveTo(k, h); g.lineTo(k + h, 0); g.stroke();
  }
}, true);
tailTex.repeat.set(2, 2);

function addFace(parent, o){
  const s = o.s || 1;
  const white = basic(0xffffff);
  const black = lam(0x140c08), iris = lam(0x6b3a12), dark = lam(NOSE), brow = lam(0x4a2614);
  [-1, 1].forEach(side => {
    const ex = side * 0.115 * s, ey = o.y + 0.08*s, ez = o.z;
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.085*s, 16, 12), white);
    eye.scale.z = 0.6; eye.position.set(ex, ey, ez); parent.add(eye);
    const ir = new THREE.Mesh(new THREE.SphereGeometry(0.052*s, 12, 10), iris);
    ir.position.set(ex, ey - 0.005*s, ez - 0.04*s); parent.add(ir);
    const pu = new THREE.Mesh(new THREE.SphereGeometry(0.029*s, 10, 8), black);
    pu.position.set(ex, ey - 0.005*s, ez - 0.068*s); parent.add(pu);
    const hl = new THREE.Mesh(new THREE.SphereGeometry(0.013*s, 8, 6), white);
    hl.position.set(ex + 0.018*s, ey + 0.02*s, ez - 0.085*s); parent.add(hl);
    const br = new THREE.Mesh(new THREE.BoxGeometry(0.1*s, 0.022*s, 0.03*s), brow);
    br.position.set(ex, ey + 0.1*s, ez - 0.01*s); br.rotation.z = -side*0.25; parent.add(br);
  });
  const muzzle = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12), lam(CREAM));
  muzzle.scale.set(0.19*s, 0.12*s, 0.11*s); muzzle.position.set(0, o.y - 0.07*s, o.z); parent.add(muzzle);
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.05*s, 12, 10), dark);
  nose.scale.set(1.35, 1, 1); nose.position.set(0, o.y - 0.02*s, o.z - 0.1*s); parent.add(nose);
  const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.055*s, 0.01*s, 6, 14, Math.PI), dark);
  mouth.rotation.z = Math.PI; mouth.position.set(0, o.y - 0.09*s, o.z - 0.1*s); parent.add(mouth);
  [-1, 1].forEach(side => {
    const tooth = new THREE.Mesh(new THREE.BoxGeometry(0.045*s, 0.07*s, 0.02*s), lam(0xffffff));
    tooth.position.set(side*0.025*s, o.y - 0.17*s, o.z - 0.085*s); parent.add(tooth);
  });
}

function makeBeaver(){
  const root = new THREE.Group();
  const stand = new THREE.Group();
  stand.position.y = -R;
  root.add(stand);
  const body = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 18), lam(FUR));
  body.scale.set(0.36, 0.42, 0.33); body.position.y = 0.44; stand.add(body);
  const belly = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 14), lam(CREAM));
  belly.scale.set(0.26, 0.31, 0.16); belly.position.set(0, 0.42, -0.2); stand.add(belly);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 24, 18), lam(FUR));
  head.position.y = 0.98; head.scale.set(1.05, 0.95, 1); stand.add(head);
  addFace(stand, { y: 0.98, z: -0.25, s: 1 });
  [-1, 1].forEach(side => {
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.075, 12, 10), lam(FUR_DARK));
    ear.position.set(side*0.22, 1.2, 0.0); stand.add(ear);
    const foot = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 10), lam(PAW));
    foot.scale.set(0.11, 0.05, 0.16); foot.position.set(side*0.15, 0.04, -0.1); stand.add(foot);
  });
  function arm(side){
    const pivot = new THREE.Group();
    pivot.position.set(side*0.3, 0.64, -0.06);
    const up = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.065, 0.3, 10), lam(FUR));
    up.position.y = -0.15; pivot.add(up);
    const paw = new THREE.Mesh(new THREE.SphereGeometry(0.075, 12, 10), lam(PAW));
    paw.position.y = -0.3; pivot.add(paw);
    pivot.rotation.z = side*0.35;
    stand.add(pivot);
    return pivot;
  }
  const armL = arm(-1), armR = arm(1);
  const tail = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 12), lam(0xffffff, { map: tailTex }));
  tail.scale.set(0.22, 0.045, 0.34); tail.position.set(0, 0.1, 0.48); tail.rotation.x = -0.25; stand.add(tail);

  const ball = new THREE.Group();
  root.add(ball);
  ball.add(new THREE.Mesh(new THREE.SphereGeometry(R, 26, 20), lam(FUR)));
  const bb = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 14), lam(CREAM));
  bb.scale.set(0.3, 0.26, 0.2); bb.position.set(0, -0.12, -0.36); ball.add(bb);
  addFace(ball, { y: 0.12, z: -0.42, s: 0.85 });
  [-1, 1].forEach(side => {
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 10), lam(FUR_DARK));
    ear.position.set(side*0.24, 0.4, -0.12); ball.add(ear);
    const paw = new THREE.Mesh(new THREE.SphereGeometry(0.075, 12, 10), lam(PAW));
    paw.position.set(side*0.14, -0.22, -0.44); ball.add(paw);

// ribbon geometry along the curved centerline: top (group 0) + sides & end caps (group 1)
function ribbonGeo(sA, sB, wA, wB, thick, yTop){
  const steps = Math.max(2, Math.ceil((sB - sA) / 0.5));
  const P = [];
  for (let k = 0; k <= steps; k++){
    const s = lerp(sA, sB, k / steps), c = centerAt(s), w = lerp(wA, wB, k / steps);
    const rx = Math.cos(c.h), rz = Math.sin(c.h);
    P.push({ s, lx: c.x - rx*w/2, lz: c.z - rz*w/2, rx: c.x + rx*w/2, rz: c.z + rz*w/2 });
  }
  const yt = yTop || 0, yb = yt - thick;
  const top = [], topUv = [], side = [], sideUv = [];
  const V = (arr, x, y, z) => arr.push(x, y, z);
  for (let k = 0; k < steps; k++){
    const a = P[k], b = P[k+1];
    V(top, a.lx, yt, a.lz); V(top, a.rx, yt, a.rz); V(top, b.rx, yt, b.rz);
    V(top, a.lx, yt, a.lz); V(top, b.rx, yt, b.rz); V(top, b.lx, yt, b.lz);
    const va = a.s / 4, vb = b.s / 4;
    topUv.push(0, va, 1, va, 1, vb, 0, va, 1, vb, 0, vb);
    // right side
    V(side, a.rx, yt, a.rz); V(side, a.rx, yb, a.rz); V(side, b.rx, yb, b.rz);
    V(side, a.rx, yt, a.rz); V(side, b.rx, yb, b.rz); V(side, b.rx, yt, b.rz);
    // left side
    V(side, a.lx, yt, a.lz); V(side, b.lx, yb, b.lz); V(side, a.lx, yb, a.lz);
    V(side, a.lx, yt, a.lz); V(side, b.lx, yt, b.lz); V(side, b.lx, yb, b.lz);
    for (let j = 0; j < 12; j++) sideUv.push(0, 0);
  }
  const a = P[0], b = P[steps];
  V(side, a.lx, yt, a.lz); V(side, a.lx, yb, a.lz); V(side, a.rx, yb, a.rz);
  V(side, a.lx, yt, a.lz); V(side, a.rx, yb, a.rz); V(side, a.rx, yt, a.rz);
  V(side, b.lx, yt, b.lz); V(side, b.rx, yb, b.rz); V(side, b.lx, yb, b.lz);
  V(side, b.lx, yt, b.lz); V(side, b.rx, yt, b.rz); V(side, b.rx, yb, b.rz);

  geo.setAttribute('uv', new THREE.Float32BufferAttribute(topUv.concat(sideUv), 2));

  geo.addGroup(top.length / 3, side.length / 3, 1);
  geo.computeVertexNormals();
  return geo;
}

          if (rng() < 0.6){ const ring = new THREE.Mesh(G_('pring', () => new THREE.TorusGeometry(1.6, 0.12, 6, 30)), dm('pring', () => basic(0xffe0a0)));
            ring.scale.setScalar(r); ring.rotation.x = 1.2; o.add(ring); }
          p.set(p.x + side*10, p.y + 6 + rng()*10, p.z);
          decorAnims.push(t => { pl.rotation.y = t * 0.2; });
        } else {
          const a = new THREE.Mesh(G_('ast', () => new THREE.DodecahedronGeometry(1)), dm('ast', () => lam(0x6a6070))); a.scale.setScalar(0.6 + rng()*1.4); o.add(a);
          const sp = 0.3 + rng(); decorAnims.push(t => { a.rotation.x = t*sp; a.rotation.y = t*sp*0.7; });
        }
      } else if (wd === 'volcano'){
        o = new THREE.Group(); p.set(p.x + side*12, world.groundY, p.z);
        if (rng() < 0.5){
          const h = 14 + rng()*14, r = 9 + rng()*6;
          const v = new THREE.Mesh(G_('volc', () => new THREE.CylinderGeometry(0.25, 1, 1, 10)), dm('volc', () => lam(0x3a2a2a))); v.scale.set(r, h, r); v.position.y = h/2; o.add(v);
          const top = new THREE.Mesh(G_('vtop', () => new THREE.CylinderGeometry(0.25, 0.25, 0.3, 10)), dm('vtop', () => basic(0xff7a1a))); top.scale.set(r, 1, r); top.position.y = h; o.add(top);
        } else {
          const rk = new THREE.Mesh(G_('ast', () => new THREE.DodecahedronGeometry(1)), dm('vrock', () => lam(0x2a1c1a))); rk.scale.set(3, 2, 3); rk.position.y = 1; o.add(rk);
        }
      }
      if (o){ o.position.copy(p); o.rotation.y = rng() * 6; addDecor(o); }
    }
  }
}

function applyWorldLook(){
  const w = world;
  document.body.style.background = 'linear-gradient(' + w.sky[0] + ' 0%,' + w.sky[1] + ' 55%,' + w.sky[2] + ' 100%)';
  scene.fog.color.setHex(w.fog);
  hemi.color.setHex(w.hemi[0]); hemi.groundColor.setHex(w.hemi[1]); hemi.intensity = w.hemi[2];
  sun.intensity = w.sun;
  groundMesh.visible = w.ground !== null;
  if (w.ground !== null){
    groundMesh.material = w.decor === 'volcano' ? basic(w.ground) : lam(w.ground);
    groundMesh.position.y = w.groundY;
  }
  clouds.forEach(c => { c.visible = !!w.clouds; });
  cloudMat.color.setHex(w.decor === 'winter' ? 0xe8eef4 : 0xffffff);
  stars.visible = w.decor === 'space';
  snow.visible = w.decor === 'winter';
  embers.visible = w.decor === 'volcano';
  scene.fog.near = w.decor === 'space' ? 60 : 40;
  scene.fog.far = w.decor === 'space' ? 160 : 115;
}

// =====================================================================
// level generation
// =====================================================================
function clearLevel(){
  levelObjs.forEach(o => { scene.remove(o); if (o.userData.ownGeo) o.geometry.dispose(); });
  levelObjs = []; obstacles = []; pads = []; pickups = []; blinkTiles = []; movers = []; decorAnims = [];
}
function addObj(o){ scene.add(o); levelObjs.push(o); return o; }

function buildLevel(n){
  clearLevel();
  level = n; cfg = levelCfg(n); world = worldOf(n);
  const wi = WORLDS.indexOf(world);
  const rng = mulberry32(n * 7919 + 13);
  const unlocked = OBST.filter(o => n >= o.from).map(o => o.type);

  // ---- 1. tile list (track space) ----
  tiles = [];
  let s = -4 * L, h = 0, w = 3.4, roadCount = 0, straightLeft = 4, turnLeft = 0, turnStep = 0;
  let styleIdx = 0, styleLeft = 6, sinceGap = 0, sinceObs = 0, safe = 0, colorK = 0;
  const startRoad = (len, w0, w1, h0, h1, extra) => {
    const t = Object.assign({ kind: 'road', s0: s, len, w0, w1, h0, h1, style: world.roads[styleIdx], color: world.palette[colorK++ % world.palette.length] }, extra || {});
    tiles.push(t); s += len; return t;
  };
  for (let k = 0; k < 4; k++) startRoad(L, 3.4, 3.4, 0, 0, { start: true });
  let lastWasGap = false;
  while (roadCount < cfg.tiles){
    const p = roadCount / cfg.tiles;
    // road style runs
    if (--styleLeft <= 0){ styleIdx = (styleIdx + 1 + Math.floor(rng() * (world.roads.length - 1))) % world.roads.length; styleLeft = 5 + Math.floor(rng() * 6); }
    const style = world.roads[styleIdx];
    // width: narrows with level and within the level; highway is a wide "otoban"
    let wt = clamp(cfg.wBase * lerp(1.08, 0.85, p) + (rng()-0.5) * cfg.wVar * 2, 1.25, 3.4);
    if (style === 'highway') wt += 1.4;
    if (lastWasGap) wt = Math.max(wt, 2.0);
    // heading: straight runs and real left/right turns
    const h0 = h;
    if (turnLeft > 0){ h += turnStep; turnLeft--; if (turnLeft === 0) straightLeft = 2 + Math.floor(rng() * 4); }
    else if (straightLeft > 0) straightLeft--;
    else {
      let dir = rng() < 0.5 ? -1 : 1;
      if (h > 0.5) dir = -1; else if (h < -0.5) dir = 1;
      const ang = (0.45 + rng() * 0.55) * cfg.turnMax + 0.25;
      turnLeft = 3 + Math.floor(rng() * 3); turnStep = dir * ang / turnLeft;
      h += turnStep; turnLeft--;
    }
    h = clamp(h, -1.3, 1.3);
    const straight = Math.abs(h - h0) < 1e-6 && turnLeft === 0;

    // gaps (short and fair), sometimes with a moving platform in the middle
    if (straight && roadCount > 6 && p < 0.93 && sinceGap > 3 && safe <= 0 && !lastWasGap && rng() < cfg.gapP){
      tiles[tiles.length - 1].hazardEnd = true;
      if (unlocked.includes('mover') && rng() < 0.35){
        const g1 = 1.2 + rng() * 0.5, g2 = 1.2 + rng() * 0.5;
        const t = { kind: 'mover', s0: s, len: g1 + 3 + g2, g1, w0: w, w1: w, h0: h, h1: h, amp: 0.6 + 0.6 * cfg.d, ph: rng() * 6, freq: 1.2 + rng() * 0.6 };
        tiles.push(t); s += t.len;
      } else {
        const gl = cfg.gapLen * (0.75 + rng() * 0.25);
        tiles.push({ kind: 'gap', s0: s, len: gl, w0: w, w1: w, h0: h, h1: h }); s += gl;
      }
      sinceGap = 0; lastWasGap = true;
      continue;
    }
    const t = startRoad(L, w, wt, h0, h, {});
    t.style = style; t.afterGap = lastWasGap;
    w = wt; roadCount++; sinceGap++; sinceObs++; safe--;
    lastWasGap = false;

    // blinking tile
    if (unlocked.includes('blink') && straight && !t.afterGap && safe <= 0 && sinceObs > 1 && rng() < 0.05 + 0.08 * cfg.d){
      t.blink = true; t.ph = rng(); sinceObs = 0; continue;
    }
    // trampoline (+ rare heart above its arc)
    if (cfg.padP > 0 && roadCount > 5 && p < 0.85 && safe <= 0 && !t.afterGap && rng() < cfg.padP){
      t.pad = { u: 0.5, lat: (rng() - 0.5) * Math.max(0, wt - 1.2) * 0.6 };
      safe = 6; sinceObs = 0;
      continue;
    }
    // obstacles
    const pool = unlocked.filter(x => x !== 'blink' && x !== 'mover' && !(x === 'hopper' && wi !== 9));
    if (pool.length && roadCount > 6 && safe <= 0 && !t.afterGap && sinceObs > 1 && rng() < cfg.obsP){
      const newest = pool[pool.length - 1];
      t.obs = rng() < 0.35 ? newest : pool[Math.floor(rng() * pool.length)];
      sinceObs = 0;
    }
  }
  finishS = s;
  for (let k = 0; k < 5; k++){ const t = startRoad(L, k === 0 ? w : 3.6, 3.6, h, h, { finish: true }); t.style = 'candy'; t.color = k % 2 ? 0xffffff : 0xffe07a; }
  sMin = tiles[0].s0; sMax = s;

  // ---- 2. sample the centerline ----
  const N = Math.ceil((sMax - sMin) / DS) + 2;
  cX = new Float32Array(N); cZ = new Float32Array(N); cH = new Float32Array(N);
  let x = 0, z = -sMin, ti = 0; // so that s = 0 maps near z = 0
  for (let k = 0; k < N; k++){
    const ss = sMin + k * DS;
    while (ti < tiles.length - 1 && ss >= tiles[ti].s0 + tiles[ti].len) ti++;
    const t = tiles[ti], u = clamp((ss - t.s0) / t.len, 0, 1);
    const hh = lerp(t.h0, t.h1, u);
    cX[k] = x; cZ[k] = z; cH[k] = hh;
    x += Math.sin(hh) * DS; z -= Math.cos(hh) * DS;
  }
  // shift so s = 0 is at the origin
  const c0 = centerAt(0); for (let k = 0; k < N; k++){ cX[k] -= c0.x; cZ[k] -= c0.z; }

  // ---- 3. meshes ----
  totalApples = 0;
  let firstHeart = n % 3 === 0;
  tiles.forEach((t, idx) => {
    if (t.kind === 'road'){
      const geo = ribbonGeo(t.s0, t.s0 + t.len, t.w0, t.w1, TH);
      const mats = roadMats(t.style, t.color);
      if (t.blink){ mats[0] = mats[0].clone(); mats[0].transparent = true; mats[1] = mats[1].clone(); mats[1].transparent = true; }
      const m = new THREE.Mesh(geo, mats); m.userData.ownGeo = true; addObj(m); t.mesh = m;
      if (t.blink) blinkTiles.push(t);
      if (t.hazardEnd){
        const hz = new THREE.Mesh(ribbonGeo(t.s0 + t.len - 1.2, t.s0 + t.len, lerp(t.w0, t.w1, 0.7), t.w1, 0.02, 0.012), [hazardMat, hazardMat]);
        hz.userData.ownGeo = true; addObj(hz);
      }
      if (t.finish && t === tiles.find(q => q.finish)) buildFinishArch(t);
      const wMid = (t.w0 + t.w1) / 2;
      // pad
      if (t.pad){
        const ps = t.s0 + L * 0.5, pm = makePad(); place(pm, ps, t.pad.lat, 0); addObj(pm);
        pads.push({ s: ps, lat: t.pad.lat, mesh: pm, cool: 0 });
        // apples (and maybe a heart) along the high arc
        const air = 2 * PAD_V / G, dist = cfg.speed * air;
        for (let k = 1; k <= 3; k++){
          const u = k / 4, ys = R + PAD_V * (u*air) - 0.5 * G * (u*air) * (u*air);
          addPickup(firstHeart && k === 2 && roadCount > 0 ? 'heart' : 'apple', ps + dist * u, t.pad.lat, ys);
          if (firstHeart && k === 2) firstHeart = false;
        }
      }
      // obstacle
      if (t.obs) addObstacle(t.obs, t, wi, rng);
      // apples
      if (!t.start && !t.finish && !t.pad && !t.blink && !t.obs && rng() < 0.45){
        const cnt = 1 + Math.floor(rng() * 3), off = (rng() - 0.5) * Math.max(0, wMid - 1);
        for (let k = 0; k < cnt; k++) addPickup('apple', t.s0 + (k + 0.5) / cnt * t.len, off, 0.75);
      }
    } else if (t.kind === 'mover'){
      const plat = new THREE.Mesh(G_('plat', () => new THREE.BoxGeometry(1.8, 0.4, 3)), lam(0xffcf3f));
      const edge = new THREE.Mesh(G_('platE', () => new THREE.BoxGeometry(1.84, 0.1, 3.04)), lam(0xff8fb1)); edge.position.y = 0.16; plat.add(edge);
      addObj(plat);
      movers.push({ t, mesh: plat, lat: 0, vel: 0 });
    }
  });
  buildDecor(rng);
  applyWorldLook();
}
function addPickup(type, s, lat, y){
  const m = type === 'heart' ? makeHeart() : makeApple();
  place(m, s, lat, y); addObj(m);
  pickups.push({ type, s, lat, y, mesh: m, taken: false, ph: Math.random() * 6 });
  if (type === 'apple') totalApples++;
}
function addObstacle(type, t, wi, rng){
  const wMid = (t.w0 + t.w1) / 2, s = t.s0 + L * (0.4 + rng() * 0.2);
  const mesh = obstacleMesh(type, wi); addObj(mesh);
  const o = { type, s, lat: 0, mesh, ph: rng() * 6, w: wMid, tile: t };
  if (type === 'static'){ o.lat = wMid >= 1.9 ? (rng() < 0.5 ? -1 : 1) * (wMid/2 - 0.55) * rng() : 0; }
  if (type === 'slider'){ o.amp = Math.max(0.3, wMid/2 - 0.45); o.freq = 1.1 + rng() * 0.8 + cfg.d; }
  if (type === 'hammer'){ o.freq = 1.6 + rng() * 0.6 + cfg.d * 0.8; }
  if (type === 'spinner'){ o.freq = 1.6 + cfg.d * 1.4; o.half = wMid / 2 + 0.3; mesh.userData.bar.scale.x = o.half * 2; }
  if (type === 'roller'){ o.lat = (rng() - 0.5) * Math.max(0, wMid - 1.4); o.s0 = s; o.s = o.s0; o.active = false; o.speed = 3 + cfg.d * 2; }
  if (type === 'hopper'){ o.lat = (rng() - 0.5) * Math.max(0, wMid - 1.2); o.freq = 1.6 + rng() * 0.6; }
  obstacles.push(o);
}
const finishTex = canvasTex(256, 64, (g, w, h) => {
  for (let x = 0; x < w; x += 16) for (let y = 0; y < h; y += 16){ g.fillStyle = ((x + y) / 16) % 2 ? '#222' : '#fff'; g.fillRect(x, y, 16, 16); }
  g.fillStyle = '#ffcf3f'; g.fillRect(56, 12, 144, 40);
  g.fillStyle = '#6a4319'; g.font = 'bold 30px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('BİTİŞ', 128, 33);
});
function buildFinishArch(t){
  const grp = new THREE.Group();
  const w = t.w0;
  [-1, 1].forEach(side => { const p = new THREE.Mesh(G_('fpost', () => new THREE.CylinderGeometry(0.12, 0.12, 2.6, 10)), lam(0xffffff)); p.position.set(side*(w/2 + 0.15), 1.3, 0); grp.add(p); });
  const dark = lam(0x222222), fm = lam(0xffffff, { map: finishTex });
  const banner = new THREE.Mesh(new THREE.BoxGeometry(w + 0.5, 0.7, 0.08), [dark, dark, dark, dark, fm, fm]);
  banner.position.y = 2.45; grp.add(banner);
  place(grp, t.s0, 0, 0); addObj(grp);
}

// =====================================================================
// input
// =====================================================================
const input = { left: false, right: false, jumpBuf: 0, dragPx: 0 };
const TAP_MAX_MOVE = 12, TAP_MAX_TIME = 300;
const pointers = new Map();
const inGame = () => state === 'play';
window.addEventListener('pointerdown', e => {
  if (!inGame() || (e.target.closest && e.target.closest('button'))) return;
  e.preventDefault(); initAudio();
  pointers.set(e.pointerId, { x0: e.clientX, y0: e.clientY, last: e.clientX, t0: performance.now(), moved: false });
}, { passive: false });
window.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p || !inGame()) return;
  e.preventDefault();
  if (!p.moved && Math.hypot(e.clientX - p.x0, e.clientY - p.y0) > TAP_MAX_MOVE){ p.moved = true; p.last = p.x0; }
  if (p.moved){ input.dragPx += e.clientX - p.last; p.last = e.clientX; }
}, { passive: false });
function endPointer(e, cancelled){
  const p = pointers.get(e.pointerId);
  if (!p) return;
  pointers.delete(e.pointerId);
  if (!cancelled && inGame() && !p.moved && performance.now() - p.t0 < TAP_MAX_TIME) input.jumpBuf = 0.15;
}
window.addEventListener('pointerup', e => endPointer(e, false));
window.addEventListener('pointercancel', e => endPointer(e, true));
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (inGame()) e.preventDefault(); }, { passive: false });
window.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') input.left = true;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') input.right = true;
  if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W'){ e.preventDefault(); if (inGame()) input.jumpBuf = 0.15; }
});
window.addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') input.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') input.right = false;
});

// =====================================================================
// game state
// =====================================================================
let state = 'menu';
const ball = { s: -1.5, lat: 0, y: R, targetLat: 0, vy: 0, rollV: 0, speed: 7.5, grounded: true, falling: false,
  coyote: 0, checkpoint: 0, invuln: 0, wait: 0, onMover: null };
let lives = START_LIVES, apples = 0, winT = 0, menuT = 0, time = 0, celebrateT = 0;
const ballWorld = new THREE.Vector3();

function toast(msg, ms){
  const el = $('toast'); el.innerHTML = msg; el.style.opacity = 1;
  clearTimeout(toast._t); toast._t = setTimeout(() => { el.style.opacity = 0; }, ms || 1300);
}
function show(id){ ['menu','levels','win','lose'].forEach(x => $(x).classList.toggle('hidden', x !== id)); }
function updateHud(){
  $('hLevel').textContent = world.emoji + ' ' + level;
  $('hLives').textContent = '❤️'.repeat(Math.max(0, lives)) + (lives < START_LIVES ? '🤍'.repeat(START_LIVES - lives) : '');
  $('hApples').textContent = '🍎 ' + apples + '/' + totalApples;
}
function placeAtStart(){
  Object.assign(ball, { s: -1.5, lat: 0, y: R, targetLat: 0, vy: 0, rollV: 0, speed: cfg.speed, grounded: true,
    falling: false, coyote: 0, checkpoint: -1.5, invuln: 0, wait: 0, onMover: null });
  beaver.ball.quaternion.identity();
  setForm('stand', true);
  fishes.forEach(f => spawnFish(f, false));
  clouds.forEach(c => placeCloud(c, false));
}
function goMenu(){
  state = 'menu';
  const n = Math.min(save.unlocked, MAX_LEVEL);
  buildLevel(n); placeAtStart();
  $('playBtn').textContent = 'Oyna – Level ' + n;
  $('menuWorld').textContent = world.emoji + ' ' + world.name + ' Dünyası';
  $('hud').classList.add('hidden');
  show('menu');
}
function startLevel(n){
  initAudio();
  buildLevel(n); placeAtStart();
  lives = START_LIVES; apples = 0;
  pointers.clear(); input.dragPx = 0; input.jumpBuf = 0;
  state = 'play';
  ball.wait = 0.6;
  setForm('ball'); sfx.curl();
  $('hud').classList.remove('hidden');
  show(null); updateHud();
  const newObs = OBST.find(o => o.from === n && !save.seen[o.type]);
  if (newObs){ save.seen[newObs.type] = 1; writeSave(); toast(world.emoji + ' Level ' + n + '<br><span style="font-size:24px">' + newObs.label + '</span>', 2600); }
  else if (n % 10 === 1) toast(world.emoji + ' ' + world.name + ' Dünyası<br><span style="font-size:24px">Level ' + n + '</span>', 2000);
  else if (n <= 2) toast('Kaydır ve dokun!', 1500);
  else toast(world.emoji + ' Level ' + n, 1000);
}
function loseLife(){
  lives--; updateHud();
  if (lives <= 0){
    state = 'lose'; pointers.clear();
    setTimeout(() => { if (state === 'lose') show('lose'); }, 500);
    return;
  }
  Object.assign(ball, { s: ball.checkpoint, lat: 0, targetLat: 0, y: R + 1.6, vy: 0, falling: false, grounded: false, invuln: 2, wait: 0.7, onMover: null });
  obstacles.forEach(o => { if (o.type === 'roller'){ o.s = o.s0; o.active = false; } });
  pointers.clear(); input.dragPx = 0;
  toast(lives === 1 ? 'Son can!' : 'Kalan can: ' + lives, 1100);
}
function winLevel(){
  state = 'win'; winT = 0; celebrateT = 0;
  setForm('stand'); sfx.win();
  burst(worldAt(ball.s, ball.lat, 1.2), 40, [0xffe066, 0xff6b6b, 0x7cc4ff, 0x7fd8a8, 0xc5a0ff], 6);
  const ratio = totalApples ? apples / totalApples : 1;
  const st = 1 + (ratio >= 0.5 ? 1 : 0) + (ratio >= 0.9 ? 1 : 0);
  save.stars[level] = Math.max(save.stars[level] || 0, st);
  if (level < MAX_LEVEL) save.unlocked = Math.max(save.unlocked, level + 1);
  writeSave();
  $('winTitle').textContent = level === MAX_LEVEL ? 'Tüm levelleri bitirdin!' : 'Level ' + level + ' bitti!';
  $('winStars').innerHTML = '★'.repeat(st) + '<span class="off">' + '★'.repeat(3 - st) + '</span>';
  $('winStats').textContent = '🍎 ' + apples + '/' + totalApples;
  $('nextBtn').classList.toggle('hidden', level >= MAX_LEVEL);
  setTimeout(() => { if (state === 'win') show('win'); }, 1300);
}
function openLevels(){
  const grid = $('grid'); grid.innerHTML = '';
  for (let n = 1; n <= MAX_LEVEL; n++){
    if (n % 10 === 1){ const wh = document.createElement('div'); wh.className = 'wh'; const w = worldOf(n); wh.textContent = w.emoji + ' ' + w.name; grid.appendChild(wh); }
    const b = document.createElement('button');
    const open = n <= save.unlocked;
    b.className = 'lv' + (open ? '' : ' locked') + (n === Math.min(save.unlocked, MAX_LEVEL) ? ' cur' : '');
    const st = save.stars[n] || 0;
    b.innerHTML = open ? n + '<small>' + (st ? '★'.repeat(st) : '&nbsp;') + '</small>' : '🔒<small>' + n + '</small>';
    if (open) b.addEventListener('click', () => startLevel(n));
    grid.appendChild(b);
  }
  show('levels');
  const cur = grid.querySelector('.cur'); if (cur) cur.scrollIntoView({ block: 'center' });
}
$('playBtn').addEventListener('click', () => startLevel(Math.min(save.unlocked, MAX_LEVEL)));
$('levelsBtn').addEventListener('click', openLevels);
$('levelsBack').addEventListener('click', goMenu);
$('nextBtn').addEventListener('click', () => startLevel(Math.min(level + 1, MAX_LEVEL)));
$('winLevelsBtn').addEventListener('click', openLevels);
$('retryBtn').addEventListener('click', () => startLevel(level));
$('loseLevelsBtn').addEventListener('click', openLevels);
$('muteBtn').addEventListener('click', () => { muted = !muted; $('muteBtn').textContent = muted ? 'Ses: Kapalı' : 'Ses: Açık'; });

function spawnFish(f, ahead){
  const side = Math.random() < 0.5 ? -1 : 1;
  const s = ball.s + (ahead ? 30 + Math.random() * 60 : 8 + Math.random() * 80);
  const c = centerAt(s);
  worldAt(s, side * (3.5 + Math.random() * 9), -1 + Math.random() * 6, f.g.position);
  const fx = Math.sin(c.h), fz = -Math.cos(c.h), sp = (Math.random() < 0.5 ? -1 : 1) * (1.2 + Math.random() * 1.8);
  f.vel.set(fx * sp + Math.cos(c.h) * (Math.random() - 0.5) * 0.6, 0, fz * sp + Math.sin(c.h) * (Math.random() - 0.5) * 0.6);
  f.bubbleT = Math.random();
}
function placeCloud(c, ahead){
  const s = ball.s + (ahead ? 60 + Math.random() * 90 : -10 + Math.random() * 150);
  const below = Math.random() < 0.55, side = Math.random() < 0.5 ? -1 : 1;
  worldAt(s, below ? (Math.random() - 0.5) * 40 : side * (12 + Math.random() * 22), below ? -7 - Math.random() * 10 : -4 + Math.random() * 12, c.position);
}
function emitBubble(f){
  const p = new THREE.Vector3(-1.0, 0.1, 0).applyMatrix4(f.g.matrixWorld);
  let b = bubbles.find(x => !x.alive);
  if (!b){
    if (bubbles.length > 70) return;
    b = { m: new THREE.Mesh(bubbleGeo, f.mats.bubble.clone()), alive: false };
    scene.add(b.m); bubbles.push(b);
  } else b.m.material.color.copy(f.mats.bubble.color);
  b.alive = true; b.life = 2.6; b.m.visible = true;
  b.m.position.copy(p); b.wob = Math.random() * 6; b.size = (0.5 + Math.random() * 0.6) * f.g.scale.x;
}
const camFwd = new THREE.Vector3(), tmpV = new THREE.Vector3();
function behindCam(p, margin){ tmpV.subVectors(p, camera.position); return tmpV.dot(camFwd) < -(margin || 4) || tmpV.lengthSq() > 140 * 140; }
function updateFish(dt, t){
  fishes.forEach(f => {
    f.g.position.addScaledVector(f.vel, dt);
    f.g.position.y += Math.sin(t*1.3 + f.phase) * 0.3 * dt;
    f.g.rotation.y = Math.atan2(f.vel.z, -f.vel.x);
    f.g.rotation.z = Math.sin(t*1.7 + f.phase) * 0.08;
    f.tail.rotation.y = Math.sin(t*7 + f.phase) * 0.45;
    f.bubbleT -= dt;
    if (f.bubbleT <= 0){ f.g.updateMatrixWorld(); emitBubble(f); f.bubbleT = 0.5 + Math.random() * 0.9; }
    if (behindCam(f.g.position)) spawnFish(f, true);
  });
  bubbles.forEach(b => {
    if (!b.alive) return;
    b.life -= dt;
    b.m.position.y += 0.8 * dt;
    b.m.position.x += Math.sin(t*3 + b.wob) * 0.25 * dt;
    const k = 1 - b.life / 2.6;
    b.m.scale.setScalar(b.size * (0.5 + k*0.7));
    b.m.material.opacity = Math.min(0.65, b.life / 0.8 * 0.65);
    if (b.life <= 0){ b.alive = false; b.m.visible = false; }
  });
}
function updateParticles(dt){
  const cp = camera.position;
  if (stars.visible) stars.position.copy(cp);
  [snow, embers].forEach(P => {
    if (!P.visible) return;
    const a = P.geometry.attributes.position, arr = a.array, down = P === snow;
    for (let k = 0; k < arr.length; k += 3){
      arr[k+1] += (down ? -2.2 : 1.8) * dt;
      arr[k] += Math.sin(time + k) * 0.3 * dt;
      if (down && arr[k+1] < -18) arr[k+1] += 36;
      if (!down && arr[k+1] > 18) arr[k+1] -= 36;
    }
    a.needsUpdate = true;
    P.position.set(cp.x, cp.y, cp.z);
  });
}

// =====================================================================
// play step (physics in track space: s along, lat sideways)
// =====================================================================
function groundAt(s, lat){
  const t = tileAt(s);
  if (!t) return null;
  if (t.kind === 'gap') return null;
  const u = (s - t.s0) / t.len;
  if (t.kind === 'mover'){
    const mv = movers.find(m => m.t === t);
    const ls = s - t.s0;
    if (ls < t.g1 || ls > t.g1 + 3) return null;
    if (Math.abs(lat - mv.lat) > 0.9 + cfg.tol) return null;
    return { t, mover: mv };
  }
  if (t.blink && t.hidden) return null;
  const w = lerp(t.w0, t.w1, u);
  if (Math.abs(lat) > w / 2 + cfg.tol) return null;
  return { t };
}

function stepPlay(dt){
  if (ball.wait > 0) ball.wait -= dt;
  const moving = ball.wait <= 0;
  ball.invuln = Math.max(0, ball.invuln - dt);

  // smooth steering (ice is slippery)
  const tNow = tileAt(ball.s);
  const glide = tNow && tNow.style === 'ice' ? 3.5 : 10;
  const steer = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  ball.targetLat += input.dragPx * (6 / Math.max(320, window.innerWidth)) + steer * 6.5 * dt;
  input.dragPx = 0;
  ball.targetLat = clamp(ball.targetLat, ball.lat - 3.5, ball.lat + 3.5);
  const prevLat = ball.lat;
  if (!ball.falling) ball.lat = lerp(ball.lat, ball.targetLat, 1 - Math.exp(-glide * dt));
  // riding a moving platform
  if (ball.onMover && ball.grounded){ ball.lat += ball.onMover.vel * dt; ball.targetLat += ball.onMover.vel * dt; }
  const vlat = (ball.lat - prevLat) / Math.max(dt, 0.001);
  ball.rollV = lerp(ball.rollV, vlat, 1 - Math.exp(-12 * dt));

  input.jumpBuf = Math.max(0, input.jumpBuf - dt);
  if (moving && input.jumpBuf > 0 && !ball.falling && (ball.grounded || ball.coyote > 0)){
    ball.vy = JUMP_V; ball.grounded = false; ball.coyote = 0; input.jumpBuf = 0; sfx.jump();
  }

  if (moving) ball.s += ball.speed * dt;
  ball.vy -= G * dt;
  ball.y += ball.vy * dt;
  if (ball.falling) ball.lat += ball.rollV * dt * 0.5;

  const gr = groundAt(ball.s, ball.lat);
  if (!ball.falling && gr && ball.vy <= 0 && ball.y <= R && ball.y > R - 0.6){
    ball.y = R; ball.vy = 0; ball.grounded = true; ball.coyote = 0.12;
    ball.onMover = gr.mover || null;
    if (gr.t.kind === 'road' && !gr.t.blink && !gr.t.finish) ball.checkpoint = gr.t.s0 + 0.3;
  } else {
    ball.grounded = false; ball.onMover = null;
    ball.coyote = Math.max(0, ball.coyote - dt);
    if (!ball.falling && ball.y < R - 0.6){ ball.falling = true; sfx.fall(); }
  }
  if (ball.y < -9){ loseLife(); return; }

  // roll the ball (axis follows the curve)
  const c = centerAt(ball.s);
  const right = tmpV.set(Math.cos(c.h), 0, Math.sin(c.h));
  if (moving) beaver.ball.rotateOnWorldAxis(right, -ball.speed * dt / R);
  const fwd = new THREE.Vector3(Math.sin(c.h), 0, -Math.cos(c.h));
  beaver.ball.rotateOnWorldAxis(fwd, ball.rollV * dt / R);

  // trampolines
  pads.forEach(pd => {
    pd.cool = Math.max(0, pd.cool - dt);
    if (ball.grounded && pd.cool <= 0 && Math.abs(pd.s - ball.s) < 0.7 && Math.abs(pd.lat - ball.lat) < 0.75){
      ball.vy = PAD_V; ball.grounded = false; pd.cool = 1; sfx.pad();
      pd.mesh.userData.top.scale.y = 3;
    }
    pd.mesh.userData.top.scale.y = lerp(pd.mesh.userData.top.scale.y, 1, 1 - Math.exp(-8 * dt));
  });

  // pickups
  pickups.forEach(pk => {
    if (pk.taken || Math.abs(pk.s - ball.s) > 1) return;
    if (Math.abs(pk.lat - ball.lat) < 0.85 && Math.abs(pk.y - ball.y) < 0.9){
      pk.taken = true; pk.mesh.visible = false;
      if (pk.type === 'heart'){
        if (lives < MAX_LIVES){ lives++; toast('+1 can! ❤️', 1100); } else toast('Canların dolu! ❤️', 1000);
        sfx.heart(); burst(pk.mesh.position, 24, [0xff3a6a, 0xffffff, 0xff9ab8], 5);
      } else {
        apples++; sfx.apple(); burst(pk.mesh.position, 14, [0xffe066, 0xff6b6b, 0xffffff], 4);
      }
      updateHud();
    }
  });

  // obstacles
  if (!ball.falling && ball.invuln <= 0){
    for (const o of obstacles){
      if (Math.abs(o.s - ball.s) > 3) continue;
      if (obstacleHit(o)){
        sfx.bonk(); ball.falling = true; ball.vy = 5; ball.grounded = false;
        ball.rollV = (o.curLat > ball.lat ? -1 : 1) * 4;
        break;
      }
    }
  }

  // progress + finish
  $('barFill').style.width = (clamp(ball.s / finishS, 0, 1) * 100).toFixed(1) + '%';
  if (ball.s > finishS + 1.5 && !ball.falling && ball.grounded) winLevel();
  beaver.root.visible = ball.invuln <= 0 || Math.floor(ball.invuln * 10) % 2 === 0;
}

function obstacleHit(o){
  const ds = Math.abs(o.s - ball.s), dl = Math.abs(o.curLat - ball.lat), y = ball.y;
  switch (o.type){
    case 'static':  return ds < 0.75 && dl < 0.8 && y < 0.6 + R;
    case 'slider':  return ds < 0.8 && dl < 0.85 && y < 0.75 + R;
    case 'roller':  return ds < 0.85 && dl < 1.0 && y < 0.8 + R;
    case 'hammer':  return ds < 0.75 && dl < 0.75 && Math.abs(y - o.headY) < 0.85;
    case 'hopper':  return ds < 0.75 && dl < 0.8 && Math.abs(y - o.hy) < 0.85;
    case 'spinner': {
      if (y > 0.42 + R + 0.1) return false;
      // distance from ball to the rotating bar (in track plane)
      const a = o.ang, bx = Math.cos(a), bz = -Math.sin(a);
      const px = ball.lat - 0, pz = ball.s - o.s;
      const proj = clamp(px * bx + pz * bz, -o.half, o.half);
      return Math.hypot(px - proj * bx, pz - proj * bz) < 0.42;
    }
  }
  return false;
}

function updateLevelObjects(dt){
  // obstacles
  obstacles.forEach(o => {
    const t = time;
    o.curLat = o.lat;
    if (o.type === 'slider'){ o.curLat = Math.sin(t * o.freq + o.ph) * o.amp; place(o.mesh, o.s, o.curLat, 0); }
    else if (o.type === 'hammer'){
      const ang = Math.sin(t * o.freq + o.ph) * 1.0;
      place(o.mesh, o.s, 0, 3.4);
      o.mesh.userData.arm.rotation.z = ang;
      o.curLat = Math.sin(ang) * 2.5; o.headY = 3.4 - Math.cos(ang) * 2.5;
    } else if (o.type === 'spinner'){
      o.ang = t * o.freq + o.ph;
      place(o.mesh, o.s, 0, 0);
      o.mesh.userData.bar.rotation.y = -o.ang;
      o.curLat = 0;
    } else if (o.type === 'roller'){
      if (!o.active && state === 'play' && o.s0 - ball.s < 20) o.active = true;
      if (o.active && state === 'play') o.s -= o.speed * dt;
      if (o.s < ball.s - 10) o.s = -1000;
      place(o.mesh, o.s, o.lat, 0);
      o.mesh.userData.spin.rotation.x += o.speed * dt / 0.45 * (o.active ? 1 : 0);
      o.mesh.visible = o.s > -999;
    } else if (o.type === 'hopper'){
      o.hy = 0.42 + 2.4 * Math.max(0, Math.sin(t * o.freq + o.ph));
      place(o.mesh, o.s, o.lat, o.hy);
    } else if (!o.placed){ place(o.mesh, o.s, o.lat, 0); o.placed = true; }
  });
  // moving platforms
  movers.forEach(m => {
    const prev = m.lat;
    m.lat = Math.sin(time * m.t.freq + m.t.ph) * m.t.amp;
    m.vel = (m.lat - prev) / Math.max(dt, 0.001);
    place(m.mesh, m.t.s0 + m.t.g1 + 1.5, m.lat, -0.2);
  });
  // blinking tiles: visible 70% of a 2.2 s cycle, flashing before they vanish
  blinkTiles.forEach(t => {
    const ph = (time / 2.2 + t.ph) % 1;
    t.hidden = ph > 0.7;
    const warn = ph > 0.55 && ph <= 0.7;
    t.mesh.visible = !t.hidden;
    const op = warn ? (Math.floor(time * 12) % 2 ? 0.35 : 0.9) : 1;
    t.mesh.material[0].opacity = op * (t.style === 'glass' ? 0.55 : 1);
    t.mesh.material[1].opacity = op;
  });
  // pickups bob
  pickups.forEach(pk => {
    if (pk.taken) return;
    pk.mesh.rotation.y += dt * 2;
    pk.mesh.position.y = pk.y + Math.sin(time * 3 + pk.ph) * 0.1;
  });
  decorAnims.forEach(fn => fn(time));
  if (world.decor === 'volcano' && groundMesh.material.color){ groundMesh.material.color.setHSL(0.06, 1, 0.5 + Math.sin(time * 1.5) * 0.06); }
}

// =====================================================================
// main step
// =====================================================================
const camTarget = new THREE.Vector3(), lookTarget = new THREE.Vector3(), lookCur = new THREE.Vector3();
function step(dt){
  time += dt;
  updateForm(dt);
  const c = centerAt(ball.s);

  if (state === 'play'){
    stepPlay(dt);
    beaver.root.rotation.y = lerp(beaver.root.rotation.y, -c.h, 1 - Math.exp(-10 * dt));
  } else if (state === 'win'){
    winT += dt;
    ball.speed = Math.max(0, ball.speed - 16 * dt);
    ball.s += ball.speed * dt;
    ball.lat = lerp(ball.lat, 0, 1 - Math.exp(-3 * dt));
    beaver.root.visible = true;
    beaver.root.rotation.y = lerp(beaver.root.rotation.y, -c.h + Math.PI, 1 - Math.exp(-5 * dt));
    ball.y = R + Math.abs(Math.sin(winT * 6)) * 0.35 * (winT > 0.3 ? 1 : 0);
    beaver.armR.rotation.z = 2.6 + Math.sin(winT * 10) * 0.4;
    beaver.armL.rotation.z = -2.6 - Math.sin(winT * 10) * 0.4;
    celebrateT -= dt;
    if (celebrateT <= 0 && winT < 3){ celebrateT = 0.5; burst(worldAt(ball.s + 0.5, (Math.random()-0.5)*2, 1.5), 18, [0xffe066, 0xff6b6b, 0x7cc4ff, 0x7fd8a8], 5); }
  } else if (state === 'lose'){
    beaver.root.visible = false;
  } else {
    menuT += dt;
    beaver.root.visible = true;
    beaver.root.rotation.y = -c.h + Math.PI;
    ball.y = R;
    beaver.armR.rotation.z = 2.5 + Math.sin(menuT * 6) * 0.45;
    beaver.armL.rotation.z = -0.35;
  }
  if (state !== 'win' && state !== 'menu'){ beaver.armR.rotation.z = 0.35; beaver.armL.rotation.z = -0.35; }

  worldAt(ball.s, ball.lat, ball.y, ballWorld);
  beaver.root.position.copy(ballWorld);

  // shadow
  const gr = cX ? groundAt(ball.s, ball.lat) : null;
  if (beaver.root.visible && gr && ball.y > -0.2){
    shadow.visible = true;
    const sc = 1 / (1 + Math.max(0, ball.y - R) * 0.6);
    shadow.scale.setScalar(sc); shadow.material.opacity = 0.25 * sc;
    shadow.position.set(ballWorld.x, gr.mover ? 0.02 : 0.01, ballWorld.z);
  } else shadow.visible = false;

  updateLevelObjects(dt);

  // sparks
  for (let k = sparks.length - 1; k >= 0; k--){
    const sp = sparks[k];
    sp.life -= dt; sp.v.y -= 9 * dt;
    sp.m.position.addScaledVector(sp.v, dt);
    sp.m.material.opacity = Math.max(0, sp.life / 0.9);
    if (sp.life <= 0){ scene.remove(sp.m); sp.m.material.dispose(); sparks.splice(k, 1); }
  }

  // camera (follows the curve)
  const f = 1 - Math.exp(-4.5 * dt);
  if (state === 'menu' || state === 'win'){
    worldAt(ball.s - 3.1, ball.lat + 0.9, 1.45, camTarget);
    worldAt(ball.s, ball.lat, 0.75, lookTarget);
  } else if (state === 'play' && !ball.falling){
    worldAt(ball.s - 7, ball.lat * 0.85, 3.4 + Math.max(0, ball.y - R) * 0.35, camTarget);
    worldAt(ball.s + 5, ball.lat * 0.9, 0.3, lookTarget);
  } else {
    lookTarget.set(ballWorld.x, Math.max(ballWorld.y, -4), ballWorld.z);
  }
  if (!(state === 'play' && ball.falling) && state !== 'lose') camera.position.lerp(camTarget, f);
  lookCur.lerp(lookTarget, f);
  camera.lookAt(lookCur);
  camera.getWorldDirection(camFwd);

  updateFish(dt, time);
  clouds.forEach(cl => { if (cl.visible && behindCam(cl.position, 15)) placeCloud(cl, true); });
  updateParticles(dt);
  if (groundMesh.visible){ groundMesh.position.x = camera.position.x; groundMesh.position.z = camera.position.z; }
}

// =====================================================================
// start
// =====================================================================
goMenu();
worldAt(ball.s - 3.1, 0.9, 1.45, camera.position);
worldAt(ball.s, 0, 0.75, lookCur);
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  step(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

if ('serviceWorker' in navigator && location.protocol === 'https:'){
  try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch(e){}
}
})();
</script>
</body>
</html>
