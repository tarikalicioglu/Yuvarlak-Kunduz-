<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kunduz Top</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5fb2ea">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kunduz Top">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{--bark:#5a3416;--wood:#8a5a2b;--cream:#fff6e0;--honey:#ffcf3f;--honey-hi:#ffe27a;--apple:#e5484d;--rose:#ff8fb1;--river:#1f4f7d}
  html,body{margin:0;height:100%;overflow:hidden;font-family:'Baloo 2',system-ui,sans-serif;
    background:linear-gradient(#5fb2ea 0%,#9fd3f3 55%,#e3f3fb 100%);transition:background .6s;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;touch-action:none}
  #bg{position:fixed;inset:0;z-index:-1;display:none}
  #bgImg{position:absolute;left:0;right:0;top:0;height:max(47vh,56vw);background-repeat:no-repeat;background-position:50% 0;background-size:cover;
    -webkit-mask-image:linear-gradient(#000 74%,transparent);mask-image:linear-gradient(#000 74%,transparent)}
  .pose{display:block;margin:0 auto 6px;height:150px;width:auto;pointer-events:none}
  .hidden{display:none!important}
  button{touch-action:manipulation}
  button:focus-visible,input:focus-visible{outline:4px solid #fff;outline-offset:3px}

  /* sticker lettering: cream fill, bark outline, hard drop */
  h1,h2,#toast{color:var(--cream);-webkit-text-stroke:9px var(--bark);paint-order:stroke fill;
    text-shadow:0 6px 0 var(--bark);letter-spacing:.01em}
  h1{font-size:clamp(44px,13.5vw,68px);margin:6px 0 0;line-height:1;transform:rotate(-3deg);white-space:nowrap}
  h2{font-size:clamp(34px,10.5vw,44px);margin:0;line-height:1.1;-webkit-text-stroke-width:6px;letter-spacing:.03em;text-shadow:0 4px 0 var(--bark)}
  #toast{position:fixed;top:22%;left:0;right:0;text-align:center;font-weight:800;font-size:34px;line-height:1.2;
    -webkit-text-stroke-width:7px;text-shadow:0 4px 0 var(--bark);pointer-events:none;opacity:0;transition:opacity .3s;padding:0 16px}

  /* HUD */
  #hud{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;pointer-events:none;
    color:var(--bark);font-weight:800;font-size:19px}
  #hudRow{display:flex;justify-content:space-between;align-items:center;gap:6px}
  .pill{background:var(--cream);border:3px solid var(--bark);box-shadow:0 3px 0 var(--bark);
    padding:0 11px;border-radius:999px;white-space:nowrap;line-height:1.5}
  #bar{margin-top:10px;height:14px;border-radius:999px;background:var(--cream);border:3px solid var(--bark);overflow:hidden}
  #barFill{height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--honey) 0 10px,var(--honey-hi) 10px 20px);
    border-right:3px solid var(--bark);border-radius:999px}
  #pauseBtn{position:fixed;top:calc(72px + env(safe-area-inset-top));right:10px;width:48px;height:48px;border-radius:50%;
    border:3px solid var(--bark);box-shadow:0 3px 0 var(--bark);background:var(--cream);color:var(--bark);font-size:20px;cursor:pointer;padding:0}
  #pauseBtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--bark)}

  /* screens */
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#fff;text-align:center;padding:24px;box-sizing:border-box}
  .dim{background:rgba(25,45,85,.55)}
  #menu,#win{justify-content:space-between;padding-top:calc(36px + env(safe-area-inset-top));
    padding-bottom:calc(32px + env(safe-area-inset-bottom));
    background:linear-gradient(rgba(25,45,85,.3),rgba(25,45,85,0) 30%,rgba(25,45,85,0) 60%,rgba(25,45,85,.5))}
  .sub{display:table;margin:12px auto 0;font-size:18px;line-height:1.5;font-weight:800;color:var(--bark);
    background:var(--cream);border:3px solid var(--bark);box-shadow:0 3px 0 var(--bark);border-radius:999px;padding:0 14px}
  #menuBank{margin-top:8px;word-spacing:2px}
  .btns{display:flex;flex-direction:column;gap:13px;align-items:center}
  .row{display:flex;gap:10px}

  /* buttons: one family, three sizes */
  .big,.mid,.small,.lv,.item{font-family:inherit;font-weight:800;cursor:pointer;border:3px solid var(--bark);color:var(--bark)}
  .big{font-size:26px;border-radius:999px;padding:9px 36px;min-width:230px;
    background:linear-gradient(var(--honey-hi),var(--honey) 55%);box-shadow:0 7px 0 var(--bark)}
  .big:active{transform:translateY(5px);box-shadow:0 2px 0 var(--bark)}
  .big.alt{background:var(--cream)}
  #playBtn{font-size:30px;padding:10px 40px;min-width:270px}
  .mid{font-size:16px;border-radius:18px;padding:8px 4px;width:158px;background:var(--cream);
    box-shadow:0 5px 0 var(--bark);white-space:nowrap}
  .mid:active{transform:translateY(3px);box-shadow:0 2px 0 var(--bark)}
  .small{font-size:16px;border-radius:999px;padding:5px 16px;background:var(--cream);box-shadow:0 3px 0 var(--bark);min-height:40px}
  .small:active{transform:translateY(2px);box-shadow:0 1px 0 var(--bark)}

  /* paper sheet for pause / lose / sleep / parent settings */
  .sheet{background:var(--cream);color:var(--bark);border:4px solid var(--bark);border-radius:30px;
    box-shadow:0 9px 0 var(--bark);padding:26px 22px 28px;width:100%;max-width:340px;box-sizing:border-box}
  .sheet h2{color:var(--bark);-webkit-text-stroke:0;text-shadow:none;font-size:clamp(30px,9vw,38px)}
  .sheet .btns{margin-top:18px}
  .sheet .big{min-width:0;width:100%;padding-left:10px;padding-right:10px;font-size:23px}
  .stats{font-size:22px;line-height:1.35;margin:10px 0 0}

  /* level finished: title above the beaver, buttons below */
  #winStats{display:table;margin:10px auto 0;font-size:21px;font-weight:800;color:var(--bark);background:var(--cream);
    border:3px solid var(--bark);box-shadow:0 3px 0 var(--bark);border-radius:20px;padding:2px 16px}
  .stars{font-size:62px;line-height:1.1;margin-top:18px;letter-spacing:2px;color:var(--honey);
    -webkit-text-stroke:7px var(--bark);paint-order:stroke fill;text-shadow:0 5px 0 var(--bark)}
  .stars i{font-style:normal;display:inline-block}
  .stars i:nth-child(2){transform:translateY(-10px) scale(1.15)}
  .stars .off{color:#e9dcc0}
  .stars .off i{transform:none}
  .stars img{height:64px;vertical-align:middle;filter:drop-shadow(0 4px 0 rgba(90,52,20,.35))}
  .stars .off img{filter:grayscale(1) brightness(1.35) opacity(.55)}
  .ic{height:1.25em;vertical-align:-.28em;margin:0 1px}
  .ic.off{filter:grayscale(1) brightness(1.3) opacity(.5)}

  /* level map */
  #levels,#coll{background:linear-gradient(rgba(31,79,125,.96),rgba(22,58,96,.97));justify-content:flex-start;
    padding-top:calc(20px + env(safe-area-inset-top))}
  #levelsHead,.phead{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:520px;margin-bottom:12px}
  #levelsHead h2{font-size:30px;-webkit-text-stroke-width:6px}
  #levelsStars{font-size:18px}
  #grid{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;width:100%;max-width:520px;overflow-y:auto;
    padding:6px 5px 34px;box-sizing:border-box;touch-action:pan-y;-webkit-overflow-scrolling:touch;flex:1;align-content:start}
  .wh{grid-column:1/-1;text-align:left;font-size:21px;font-weight:800;margin:12px 0 0;color:var(--cream)}
  .lv{font-size:23px;border-radius:17px;aspect-ratio:1;background:linear-gradient(var(--honey-hi),var(--honey) 60%);
    box-shadow:0 4px 0 var(--bark);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0}
  .lv:active{transform:translateY(3px);box-shadow:0 1px 0 var(--bark)}
  .lv small{font-size:11px;color:var(--wood);margin-top:3px;letter-spacing:1px}
  .lv.boss{background:linear-gradient(#ffb3c9,var(--rose) 60%)}
  .lv.locked,.lv.boss.locked{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.22);color:rgba(255,255,255,.6);
    box-shadow:none;cursor:default;transform:none;font-size:18px}
  .lv.locked small{color:rgba(255,255,255,.6);font-size:12px}
  .lv.cur{outline:4px solid #fff;outline-offset:2px}

  /* shop */
  #shop{justify-content:flex-end;padding:0;background:linear-gradient(rgba(31,79,125,0) 36%,rgba(31,79,125,.96) 49%)}
  .panel{width:100%;max-width:520px;height:52%;display:flex;flex-direction:column;
    padding:10px 14px calc(14px + env(safe-area-inset-bottom));box-sizing:border-box}
  .phead{font-size:22px;margin-bottom:8px}
  #shopGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;overflow-y:auto;touch-action:pan-y;flex:1;align-content:start;padding:2px 3px 12px}
  .item{font-size:15px;border-radius:16px;padding:8px;background:var(--cream);box-shadow:0 4px 0 var(--bark);
    display:flex;flex-direction:column;align-items:center;line-height:1.15}
  .item:active{transform:translateY(3px);box-shadow:0 1px 0 var(--bark)}
  .item .ic{font-size:30px}
  .item small{font-size:13px;color:var(--wood)}
  .item.on{background:linear-gradient(var(--honey-hi),var(--honey) 60%)}
  .item.poor{opacity:.55}

  /* collection */
  #collBody{width:100%;max-width:520px;overflow-y:auto;touch-action:pan-y;flex:1;text-align:left;padding:2px 3px 20px;box-sizing:border-box}
  .card{background:var(--cream);color:var(--bark);border:3px solid var(--bark);box-shadow:0 4px 0 var(--bark);
    border-radius:18px;padding:10px 14px;margin-bottom:13px;font-size:18px;line-height:1.3}
  .card small{font-size:14px;color:var(--wood)}
  .emo{font-size:30px;display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .emo span{position:relative}
  .emo span.off{filter:grayscale(1);opacity:.3}
  .emo small{font-size:12px;position:absolute;right:-6px;bottom:-4px;background:var(--honey);color:var(--bark);border-radius:8px;padding:0 4px}
  input{font-family:inherit;font-weight:800;font-size:18px;border:3px solid var(--bark);border-radius:12px;padding:3px 10px;width:150px;
    user-select:text;-webkit-user-select:text;color:var(--bark);background:#fff}

  /* motion: things answer the player, nothing loops except the level you are on */
  @keyframes drop{0%{transform:translateY(-140%) rotate(-9deg)}60%{transform:translateY(6%) rotate(-2deg)}80%{transform:translateY(-3%) rotate(-4deg)}100%{transform:rotate(-3deg)}}
  @keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.05);opacity:1}100%{transform:scale(1)}}
  @keyframes star{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1)}}
  @keyframes star2{0%{transform:translateY(-10px) scale(0) rotate(-40deg)}70%{transform:translateY(-10px) scale(1.5) rotate(8deg)}100%{transform:translateY(-10px) scale(1.15)}}
  @keyframes nudge{50%{transform:scale(1.07)}}
  h1{animation:drop .7s cubic-bezier(.3,.7,.3,1) both}
  .sheet{animation:pop .28s ease-out both}
  .stars>i{animation:star .45s ease-out both}
  .stars>i:nth-child(1){animation-delay:.15s}
  .stars>i:nth-child(2){animation:star2 .45s ease-out .45s both}
  .stars>i:nth-child(3){animation-delay:.75s}
  .lv.cur{animation:nudge 1.4s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){h1,.sheet,.stars>i,.stars>i:nth-child(2),.lv.cur{animation:none}}
  @media (max-height:600px){h1{font-size:46px}.btns{gap:9px}.big{padding-top:6px;padding-bottom:6px}.mid{padding:5px 4px}}
</style>
</head>
<body>
<div id="bg"><div id="bgImg"></div></div>
<div id="hud" class="hidden">
  <div id="hudRow">
    <span class="pill" id="hLevel">Level 1</span>
    <span class="pill" id="hLives"></span>
    <span class="pill" id="hApples"></span>
  </div>
  <div id="bar"><div id="barFill"></div></div>
  <span class="pill hidden" id="hPow" style="display:inline-block;margin-top:8px"></span>
</div>
<div id="toast"></div>
<button id="pauseBtn" class="hidden" aria-label="Duraklat">⏸</button>

<div class="overlay" id="menu">
  <div>
    <h1>Kunduz Top</h1>
    <p class="sub" id="menuWorld"></p>
    <p class="sub" id="menuBank"></p>
  </div>
  <div class="btns">
    <button class="big" id="playBtn">Oyna</button>
    <div class="row"><button class="mid" id="levelsBtn">🗺️ Leveller</button><button class="mid" id="dailyBtn">🎁 Günün Leveli</button></div>
    <div class="row"><button class="mid" id="endlessBtn">∞ Sonsuz Mod</button><button class="mid" id="shopBtn">🎩 Dükkân</button></div>
    <div class="row"><button class="mid" id="collBtn">🏆 Koleksiyon</button><button class="mid" id="muteBtn">🔊 Ses: Açık</button></div>
  </div>
</div>

<div class="overlay hidden" id="levels">
  <div id="levelsHead">
    <button class="small" id="levelsBack">◀ Geri</button>
    <h2>Leveller</h2>
    <b id="levelsStars" style="width:70px;text-align:right"></b>
  </div>
  <div id="grid"></div>
</div>

<div class="overlay hidden" id="win">
  <div>
    <h2 id="winTitle">Level 1 bitti!</h2>
    <div class="stars" id="winStars"></div>
    <div id="winStats"></div>
  </div>
  <div class="btns">
    <button class="big" id="nextBtn">Sonraki Level</button>
    <button class="big alt" id="winLevelsBtn">Leveller</button>
  </div>
</div>

<div class="overlay dim hidden" id="lose">
<div class="sheet">
  <img class="pose" src="art/kunduz-dizzy.webp" alt="" onerror="this.remove()">
  <h2 id="loseTitle">Canların bitti!</h2>
  <div class="stats" id="loseStats">Hiç sorun değil, bir daha dene!</div>
  <div class="btns">
    <button class="big" id="retryBtn">Tekrar Dene</button>
    <button class="big alt" id="loseLevelsBtn">Leveller</button>
  </div>
</div>
</div>

<div class="overlay hidden" id="shop">
  <div class="panel">
    <div class="phead"><button class="small" id="shopBack">◀ Geri</button><b>🎩 Dükkân</b><b id="shopBank"></b></div>
    <div id="shopGrid"></div>
  </div>
</div>

<div class="overlay hidden" id="coll">
  <div class="phead" style="width:100%;max-width:520px"><button class="small" id="collBack">◀ Geri</button><b>🏆 Koleksiyon</b><span style="width:70px"></span></div>
  <div id="collBody"></div>
</div>

<div class="overlay dim hidden" id="admin">
<div class="sheet">
  <h2>Ebeveyn Ayarları</h2>
  <div class="stats" id="admInfo"></div>
  <div class="btns">
    <button class="big alt" id="admAll"></button>
    <button class="big alt" id="admLimit"></button>
    <button class="small" id="admReset">Bugünkü süreyi sıfırla</button>
    <button class="big" id="admClose">Kapat</button>
  </div>
</div>
</div>

<div class="overlay dim hidden" id="pause">
<div class="sheet">
  <h2>Duraklatıldı</h2>
  <div class="btns">
    <button class="big" id="resumeBtn">▶ Devam Et</button>
    <button class="big alt" id="restartBtn">↻ Baştan Başla</button>
    <button class="big alt" id="pauseLevelsBtn">🗺️ Leveller</button>
    <button class="big alt" id="pauseMenuBtn">🏠 Ana Menü</button>
    <button class="small" id="pauseMuteBtn">🔊 Ses: Açık</button>
  </div>
</div>
</div>

<div class="overlay dim hidden" id="sleep">
<div class="sheet">
  <img class="pose" src="art/kunduz-sleep.webp" alt="" onerror="this.remove()">
  <h2>Kunduz yoruldu</h2>
  <div class="stats">Bugünlük bu kadar yeter.<br>Yarın devam edelim!</div>
  <div class="btns"><button class="big" id="sleepOk">Tamam</button></div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
// =====================================================================
// constants & helpers
// =====================================================================
const L = 4;            // normal tile length
const R = 0.5;          // ball radius
const TH = 0.5;         // road thickness
const G = 24;           // gravity
const JUMP_V = 8.6;     // normal jump (air time ~0.72 s)
const PAD_V = 14;       // trampoline jump
const MAX_LEVEL = 500;
const START_LIVES = 3, MAX_LIVES = 5;

const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// =====================================================================
// save (each phone keeps its own progress)
// =====================================================================
const SAVE_KEY = 'kunduzTop.v1';
function loadSave(){
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.unlocked) return s; } catch(e){}
  return { unlocked: 1, stars: {}, seen: {} };
}
let save = loadSave();
save.seen = save.seen || {};
function writeSave(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch(e){} }

// =====================================================================
// sound
// =====================================================================
let actx = null, muted = false;
function initAudio(){
  if (actx){ if (actx.state === 'suspended') actx.resume().catch(()=>{}); return; }
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ actx = null; }
}
function tone(f1, f2, dur, type, vol, delay){
  if (!actx || muted) return;
  try {
    const t = actx.currentTime + (delay || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur);
    g.gain.setValueAtTime(vol || 0.15, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch(e){}
}
const sfx = {
  jump(){ tone(320, 640, 0.18, 'square', 0.06); },
  pad(){ tone(200, 1200, 0.35, 'sine', 0.16); },
  apple(){ tone(880, 1320, 0.12, 'triangle', 0.14); tone(1320, 1760, 0.1, 'triangle', 0.1, 0.07); },
  heart(){ [784, 988, 1175, 1568].forEach((f,i)=>tone(f, f, 0.14, 'sine', 0.14, i*0.07)); },
  fall(){ tone(500, 90, 0.8, 'sawtooth', 0.07); },
  bonk(){ tone(180, 70, 0.25, 'square', 0.12); },
  curl(){ tone(300, 900, 0.25, 'sine', 0.12); },
  win(){ [523,659,784,1046,1318].forEach((f,i)=>tone(f, f, 0.18, 'triangle', 0.12, i*0.1)); }
};

// =====================================================================
// three setup
// =====================================================================
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfe9f8, 40, 110);
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 400);
const hemi = new THREE.HemisphereLight(0xffffff, 0x8fb3d6, 0.85);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff4e0, 0.75);
sun.position.set(6, 12, 5);
scene.add(sun);
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function canvasTex(w, h, draw, repeat){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (repeat){ t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  return t;
}
const lam = (color, extra) => new THREE.MeshLambertMaterial(Object.assign({ color }, extra || {}));
const basic = (color, extra) => new THREE.MeshBasicMaterial(Object.assign({ color }, extra || {}));
const geoCache = {};
const G_ = (key, make) => geoCache[key] || (geoCache[key] = make());

// =====================================================================
// worlds
// =====================================================================
const WORLDS = [

    br.position.set(ex, ey + 0.1*s, ez - 0.01*s); br.rotation.z = -side*0.25; parent.add(br);
  });
  const muzzle = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12), lam(CREAM));

function makeBeaver(){

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 24, 18), lam(FUR));
  head.position.y = 0.98; head.scale.set(1.05, 0.95, 1); stand.add(head);
  addFace(stand, { y: 0.98, z: -0.25, s: 1 });
  [-1, 1].forEach(side => {
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.075, 12, 10), lam(FUR_DARK));
    ear.position.set(side*0.22, 1.2, 0.0); stand.add(ear);
    const foot = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 10), lam(PAW));
    foot.scale.set(0.11, 0.05, 0.16); foot.position.set(side*0.15, 0.04, -0.1); stand.add(foot);
  });
  function arm(side){
    const pivot = new THREE.Group();
    pivot.position.set(side*0.3, 0.64, -0.06);
    const up = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.065, 0.3, 10), lam(FUR));
    up.position.y = -0.15; pivot.add(up);
    const paw = new THREE.Mesh(new THREE.SphereGeometry(0.075, 12, 10), lam(PAW));
    paw.position.y = -0.3; pivot.add(paw);
    pivot.rotation.z = side*0.35;
    stand.add(pivot);
    return pivot;
  }
  const armL = arm(-1), armR = arm(1);
  const tail = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 12), lam(0xffffff, { map: tailTex }));
  tail.scale.set(0.22, 0.045, 0.34); tail.position.set(0, 0.1, 0.48); tail.rotation.x = -0.25; stand.add(tail);

  const squash = new THREE.Group();
  root.add(squash);
  const ball = new THREE.Group();
  squash.add(ball);
  ball.add(new THREE.Mesh(new THREE.SphereGeometry(R, 26, 20), lam(FUR)));
  const bb = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 14), lam(CREAM));
  bb.scale.set(0.3, 0.26, 0.2); bb.position.set(0, -0.12, -0.36); ball.add(bb);
  addFace(ball, { y: 0.12, z: -0.42, s: 0.85 });
  [-1, 1].forEach(side => {
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 10), lam(FUR_DARK));
    ear.position.set(side*0.24, 0.4, -0.12); ball.add(ear);
    const paw = new THREE.Mesh(new THREE.SphereGeometry(0.075, 12, 10), lam(PAW));
    paw.position.set(side*0.14, -0.22, -0.44); ball.add(paw);
  });
  const btail = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 12), lam(0xffffff, { map: tailTex }));
  btail.scale.set(0.3, 0.05, 0.36); btail.position.set(0, 0.12, 0.47); btail.rotation.x = -1.2; ball.add(btail);
  ball.visible = false;
  return { root, stand, ball, squash, armL, armR };
}

function updateForm(dt){
  formT = Math.min(1, formT + dt / 0.35);
  const k = formT, pop = k < 1 ? 1 + Math.sin(k * Math.PI) * 0.15 : 1;
  const show = form === 'ball' ? beaver.ball : beaver.stand, hide = form === 'ball' ? beaver.stand : beaver.ball;
  hide.visible = k < 0.5; hide.scale.setScalar(Math.max(0.01, 1 - k*1.8));
  show.visible = k >= 0.35; show.scale.setScalar(Math.max(0.01, (k - 0.35) / 0.65) * pop);
}

function updateBeaverPic(dt, h){
  if (!picReady()) return;
  beaver.stand.visible = false;
  const m = beaverPic.material;
  const tinted = !!save.wear.fur && furMats.length > 0;
  if (tinted) tintCol.copy(furMats[0].color).multiplyScalar(1.5);
  if (form === 'ball' && !(state === 'play' && ball.falling) && state !== 'win' && topReady){
    beaver.ball.visible = false; beaverPic.visible = false; beaverTint.visible = false; picBall.visible = true;
    picBall.scale.setScalar(Math.max(0.3, beaver.ball.scale.x));
    ballTurn(picSpinG.quaternion, h);
    topTint.visible = tinted; if (tinted) topTint.color.copy(tintCol);
    if (wearPic){ wearPic.visible = true; wearPic.position.y = 0.8; }
    picPose = ''; return;
  }
  picBall.visible = false; beaver.ball.visible = false; beaverPic.visible = true;
  let pose = 'stand', rot = 0, cy = 0, y = -R, sx = 1, sy = 1;
  if (state === 'play' && ball.falling){ pose = 'dizzy'; cy = 0.5; y = 0.1; picSpin += dt * 7; rot = picSpin; }
  else if (state === 'win'){ pose = ball.y > R + 0.05 ? 'jump' : 'stand'; }
  else if (state === 'menu'){
    pose = (menuT % 5) < 1.6 ? 'wave' : 'stand';
    sy = 1 + Math.sin(menuT * 2.2) * 0.02; sx = 1 - Math.sin(menuT * 2.2) * 0.008;
  }
  if (pose !== 'dizzy') picSpin = 0;
  if (pose !== picPose){ picPose = pose; m.map = poseTex[pose]; m.needsUpdate = true;
    const tm = beaverTint.material; tm.map = poseTuy[pose] || null; tm.needsUpdate = true; }
  m.rotation = rot;
  beaverPic.center.set(0.5, cy);
  beaverPic.position.set(0, y, 0);
  beaverPic.scale.set(POSE[pose][0] / POSE_PX * sx, POSE[pose][1] / POSE_PX * sy, 1);
  beaverTint.visible = tinted && !!poseTuy[pose];
  if (beaverTint.visible){
    beaverTint.material.color.copy(tintCol); beaverTint.material.rotation = rot;
    beaverTint.center.copy(beaverPic.center); beaverTint.position.copy(beaverPic.position); beaverTint.scale.copy(beaverPic.scale);
  }
  if (wearPic){ wearPic.visible = pose !== 'dizzy'; wearPic.position.y = (pose === 'jump' ? 1.22 : 1.14); }
}

function centerAt(s){

}

  const c = centerAt(s);

function tileAt(s){
  let lo = 0, hi = tiles.length - 1;
  if (s < tiles[0].s0 || s >= tiles[hi].s0 + tiles[hi].len) return null;

// ribbon geometry along the curved centerline: top (group 0) + sides & end caps (group 1)
function ribbonGeo(sA, sB, wA, wB, thick, yTop, latOff){
  const steps = Math.max(2, Math.ceil((sB - sA) / 0.5));
  const P = [];
  for (let k = 0; k <= steps; k++){
    const s = lerp(sA, sB, k / steps), c = centerAt(s), w = lerp(wA, wB, k / steps);
    const rx = Math.cos(c.h), rz = Math.sin(c.h);
    const o = latOff || 0;
    P.push({ s, lx: c.x + rx*(o - w/2), lz: c.z + rz*(o - w/2), rx: c.x + rx*(o + w/2), rz: c.z + rz*(o + w/2) });
  }
  const yt = yTop || 0, yb = yt - thick;
  const top = [], topUv = [], side = [], sideUv = [];
  const V = (arr, x, y, z) => arr.push(x, y, z);
  for (let k = 0; k < steps; k++){
    const a = P[k], b = P[k+1];
    V(top, a.lx, yt, a.lz); V(top, a.rx, yt, a.rz); V(top, b.rx, yt, b.rz);
    V(top, a.lx, yt, a.lz); V(top, b.rx, yt, b.rz); V(top, b.lx, yt, b.lz);
    const va = a.s / 4, vb = b.s / 4;
    topUv.push(0, va, 1, va, 1, vb, 0, va, 1, vb, 0, vb);
    // right side
    V(side, a.rx, yt, a.rz); V(side, a.rx, yb, a.rz); V(side, b.rx, yb, b.rz);
    V(side, a.rx, yt, a.rz); V(side, b.rx, yb, b.rz); V(side, b.rx, yt, b.rz);
    // left side
    V(side, a.lx, yt, a.lz); V(side, b.lx, yb, b.lz); V(side, a.lx, yb, a.lz);
    V(side, a.lx, yt, a.lz); V(side, b.lx, yt, b.lz); V(side, b.lx, yb, b.lz);
    for (let j = 0; j < 12; j++) sideUv.push(0, 0);
  }
  const a = P[0], b = P[steps];
  V(side, a.lx, yt, a.lz); V(side, a.lx, yb, a.lz); V(side, a.rx, yb, a.rz);
  V(side, a.lx, yt, a.lz); V(side, a.rx, yb, a.rz); V(side, a.rx, yt, a.rz);
  V(side, b.lx, yt, b.lz); V(side, b.rx, yb, b.rz); V(side, b.lx, yb, b.lz);
  V(side, b.lx, yt, b.lz); V(side, b.rx, yt, b.rz); V(side, b.rx, yb, b.rz);
  for (let j = 0; j < 12; j++) sideUv.push(0, 0);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(top.concat(side), 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(topUv.concat(sideUv), 2));
  geo.addGroup(0, top.length / 3, 0);
  geo.addGroup(top.length / 3, side.length / 3, 1);
  geo.computeVertexNormals();
  return geo;
}

function itemSprite(k, h, fb){
  const m = new THREE.SpriteMaterial({ alphaTest: 0.35, fog: false, transparent: true });
  const sp = new THREE.Sprite(m);
  const show = () => { m.map = itemTex[k]; m.visible = true; m.needsUpdate = true; if (fb) fb.visible = false; };
  if (itemOK[k]) show(); else { m.visible = false; itemWait[k].push({ set visible(v){ show(); } }); }
  sp.scale.set(h * ITEM[k][0] / ITEM[k][1], h, 1);
  sp.userData.k = k; sp.userData.h = h;
  return sp;
}

function buildDecor(rng){
  const wd = world.decor, step = 13;
  for (let s = -10; s < finishS + 40; s += step){
    for (const side of [-1, 1]){
      if (rng() < 0.25) continue;
      const lat = side * (8 + rng() * 22), y0 = -3 - rng() * 9;
      const p = worldAt(s + rng()*6, lat, y0);
      let o = null;
      if (world.art && ARTSET[world.art]){
        const an = world.art, set = ARTSET[an], ir = 1.8 + rng()*1.6;
        loadArtSet(an);
        o = island(set.islands[Math.floor(rng()*set.islands.length)], ir);
        const big = artPiece(an, set.big[Math.floor(rng()*set.big.length)], 4.4 + rng()*2.8, Math.floor(rng()*3));
        big.position.set((rng()-0.5)*1.2, 0.2, (rng()-0.5)*1.2); o.add(big);
        set.small.forEach((k, i) => {
          if (rng() < 0.2) return;
          const sm = artPiece(an, k, (1.3 + rng()*1.1) * ((set.size && set.size[k]) || 1), i + Math.floor(rng()*3));
          const a = rng() * Math.PI * 2, d = ir * 0.62 * Math.sqrt(rng());
          sm.position.set(Math.cos(a) * d, 0.2, Math.sin(a) * d); o.add(sm);
          if (set.hop.includes(k)){   // little hop every few seconds
            const ph = rng() * 6, by = 0.2;
            decorAnims.push(t => { const q = (t * 0.7 + ph) % 3; sm.position.y = by + (q < 0.5 ? Math.sin(q / 0.5 * Math.PI) * 0.5 : 0); });
          }
        });
        if (set.butterflies && rng() < 0.5){ // butterfly
          const b = new THREE.Group(); const col = [0xff8fd0, 0xffd23a, 0x7cc4ff][Math.floor(rng()*3)];
          [-1,1].forEach(sd => { const wgt = new THREE.Mesh(G_('bwing', () => new THREE.CircleGeometry(0.35, 12)), dm('bw' + col, () => lam(col, { side: THREE.DoubleSide })));
            wgt.position.x = sd*0.3; wgt.rotation.x = -Math.PI/2; const piv = new THREE.Group(); piv.add(wgt); piv.userData.sd = sd; b.add(piv); });
          b.position.set(0, 2.2, 0); o.add(b);
          decorAnims.push(t => { b.children.forEach(pv => pv.rotation.z = pv.userData.sd * Math.sin(t*12) * 0.8); b.position.y = 2.2 + Math.sin(t*2)*0.4; });
        }

          const sz = 10 + rng()*10; py.scale.set(sz, sz*0.8, sz); py.position.y = sz*0.4; o.add(py); p.set(p.x + side*15, world.groundY, p.z); }
        else { const du = new THREE.Mesh(G_('dune', () => new THREE.SphereGeometry(1, 16, 8)), dm('dsand', () => lam(0xf0c87a))); du.scale.set(6, 2, 6); o.add(du);

        if (rng() < 0.5){ const sm = obstacleMesh('static', 7); sm.scale.setScalar(1.5); sm.position.set(1, 0.25, 0.8); o.add(sm); }

          const top = new THREE.Mesh(G_('vtop', () => new THREE.CylinderGeometry(0.25, 0.25, 0.3, 10)), dm('vtop', () => basic(0xff7a1a))); top.scale.set(r, 1, r); top.position.y = h; o.add(top);

}

function applyWorldLook(){
  const w = world;
  document.body.style.background = 'linear-gradient(' + w.sky[0] + ' 0%,' + w.sky[1] + ' 55%,' + w.sky[2] + ' 100%)';
  scene.fog.color.setHex(w.fog);
  hemi.color.setHex(w.hemi[0]); hemi.groundColor.setHex(w.hemi[1]); hemi.intensity = w.hemi[2];
  sun.intensity = w.sun;
  groundMesh.visible = w.ground !== null && !w.art;   // art worlds show the painted land instead
  if (w.ground !== null){
    groundMesh.material = w.decor === 'volcano' ? basic(w.ground) : lam(w.ground);
    groundMesh.position.y = w.groundY;
  }
  clouds.forEach(c => { c.visible = !!w.clouds; });
  applyCloudArt();
  bgEl.style.display = w.art ? 'block' : 'none';
  if (w.art){ loadArtSet(w.art); document.body.style.background = 'transparent'; bgImg.style.backgroundImage = 'url(' + ART + w.art + '.jpg)'; bgEl.style.backgroundColor = '#' + w.fog.toString(16).padStart(6, '0'); }
  cloudMat.color.setHex(w.decor === 'winter' ? 0xe8eef4 : 0xffffff);
  stars.visible = w.decor === 'space';
  snow.visible = w.decor === 'winter';
  embers.visible = w.decor === 'volcano';
  scene.fog.near = w.decor === 'space' ? 60 : 40;
  scene.fog.far = w.decor === 'space' ? 160 : 115;
  camera.far = w.decor === 'space' ? 230 : 140; camera.updateProjectionMatrix();

// =====================================================================
// level generation
// =====================================================================
function clearLevel(){
  levelObjs.forEach(o => { scene.remove(o); if (o.userData.ownGeo) o.geometry.dispose(); if (o.userData.trash) o.userData.trash.forEach(x => x.dispose()); });
  levelObjs = []; obstacles = []; pads = []; pickups = []; blinkTiles = []; movers = []; decorAnims = []; winds = [];
}
function addObj(o){ scene.add(o); levelObjs.push(o); return o; }

function buildLevel(n, opt){
  opt = opt || {};
  clearLevel();
  level = n;
  const cn = opt.cfgN || n;
  cfg = levelCfg(cn);
  if (opt.tiles) cfg.tiles = opt.tiles;
  world = opt.wi != null ? WORLDS[opt.wi] : worldOf(n);
  isBoss = !!opt.boss; flagS = 0;
  const wi = WORLDS.indexOf(world);
  const rng = mulberry32(opt.seed || (n * 7919 + 13));
  const unlocked = OBST.filter(o => cn >= o.from).map(o => o.type);
  const has = x => unlocked.includes(x);

  // ---- 1. tile list (track space) ----
  tiles = [];
  let s = -4 * L, h = 0, w = 3.4, roadCount = 0, straightLeft = 4, turnLeft = 0, turnStep = 0;
  let styleIdx = 0, styleLeft = 6, sinceGap = 0, sinceObs = 0, safe = 0, colorK = 0;
  let beamLeft = 0, windLeft = 0, windDir = 1, sideCount = 0;
  const startRoad = (len, w0, w1, h0, h1, extra) => {
    const t = Object.assign({ kind: 'road', s0: s, len, w0, w1, h0, h1, style: world.roads[styleIdx], color: (world.roadPal || world.palette)[colorK++ % (world.roadPal || world.palette).length] }, extra || {});
    tiles.push(t); s += len; return t;
  };
  for (let k = 0; k < 4; k++) startRoad(L, 3.4, 3.4, 0, 0, { start: true });
  let lastWasGap = false;
  while (roadCount < cfg.tiles){
    const p = roadCount / cfg.tiles;
    if (--styleLeft <= 0){ styleIdx = (styleIdx + 1 + Math.floor(rng() * (world.roads.length - 1))) % world.roads.length; styleLeft = 5 + Math.floor(rng() * 6); }
    const style = world.roads[styleIdx];
    let wt = clamp(cfg.wBase * lerp(1.08, 0.85, p) + (rng()-0.5) * cfg.wVar * 2, 1.25, 3.4);
    if (style === 'highway') wt += 1.4;
    if (lastWasGap) wt = Math.max(wt, 2.0);
    let beam = false;
    if (beamLeft > 0){ wt = 1.05; beamLeft--; beam = true; }
    // heading: straight runs and real left/right turns
    const h0 = h;
    if (beam){ /* balance beams are always straight */ }
    else if (turnLeft > 0){ h += turnStep; turnLeft--; if (turnLeft === 0) straightLeft = 2 + Math.floor(rng() * 4); }
    else if (straightLeft > 0) straightLeft--;
    else {
      let dir = rng() < 0.5 ? -1 : 1;
      if (h > 0.5) dir = -1; else if (h < -0.5) dir = 1;
      const ang = (0.45 + rng() * 0.55) * cfg.turnMax + 0.25;
      turnLeft = 3 + Math.floor(rng() * 3); turnStep = dir * ang / turnLeft;
      h += turnStep; turnLeft--;
    }
    h = clamp(h, -1.3, 1.3);
    const straight = Math.abs(h - h0) < 1e-6 && turnLeft === 0;

    // gaps (short and fair, never right after an obstacle), sometimes with a moving platform
    if (!beam && beamLeft <= 0 && windLeft <= 0 && straight && roadCount > 6 && p < 0.93 && sinceGap > 3 && sinceObs > 1 && safe <= 0 && !lastWasGap && rng() < cfg.gapP){
      tiles[tiles.length - 1].hazardEnd = true;
      if (has('mover') && rng() < 0.35){
        const g1 = 1.2 + rng() * 0.5, g2 = 1.2 + rng() * 0.5;
        const t = { kind: 'mover', s0: s, len: g1 + 3 + g2, g1, w0: w, w1: w, h0: h, h1: h, amp: 0.3 + 0.3 * cfg.d, ph: rng() * 6, freq: 1.0 + rng() * 0.5 };
        tiles.push(t); s += t.len;
      } else {
        const gl = cfg.gapLen * (0.75 + rng() * 0.25);
        tiles.push({ kind: 'gap', s0: s, len: gl, w0: w, w1: w, h0: h, h1: h }); s += gl;
      }
      sinceGap = 0; lastWasGap = true;
      continue;
    }
    const t = startRoad(L, w, wt, h0, h, {});
    t.style = beam ? 'wood' : style; t.afterGap = lastWasGap; t.beam = beam;
    w = wt; roadCount++; sinceGap++; sinceObs++; safe--;
    lastWasGap = false;
    if (beam){ sinceObs = 0; continue; }
    const plain = straight && !t.afterGap && safe <= 0 && roadCount > 6 && p < 0.9;

    // blinking tile
    if (has('blink') && plain && sinceObs > 1 && sinceGap > 3 && rng() < 0.05 + 0.08 * cfg.d){
      t.blink = true; t.ph = rng(); sinceObs = 0; sinceGap = 0; continue;
    }
    // narrow balance beam on the next two tiles
    if (has('beam') && plain && windLeft <= 0 && sinceObs > 1 && sinceGap > 2 && rng() < 0.03 + 0.04 * cfg.d){
      beamLeft = 2; turnLeft = 0; straightLeft = Math.max(straightLeft, 3); sinceObs = 0; continue;
    }
    // side wind over two tiles
    if (has('wind') && plain && windLeft <= 0 && rng() < 0.04 + 0.04 * cfg.d){ windLeft = 2; windDir = rng() < 0.5 ? -1 : 1; }
    if (windLeft > 0){ t.wind = windDir; windLeft--; sinceObs = 0; continue; }
    // trampoline
    if (cfg.padP > 0 && roadCount > 5 && p < 0.85 && safe <= 0 && !t.afterGap && rng() < cfg.padP){
      t.pad = { u: 0.5, lat: (rng() - 0.5) * Math.max(0, wt - 1.2) * 0.6 };
      safe = 6; sinceObs = 0;
      continue;
    }
    // secret side platform with a golden apple
    if (cn >= 20 && plain && sideCount < 2 && sinceObs > 1 && rng() < 0.035){
      t.side = { dir: rng() < 0.5 ? -1 : 1, w: 1.15 }; sideCount++; sinceObs = 0; continue;
    }
    // obstacles
    const pool = unlocked.filter(x => !['blink','mover','beam','wind'].includes(x) && !(x === 'hopper' && wi !== 9));
    if (pool.length && roadCount > 6 && safe <= 0 && !t.afterGap && sinceObs > 1 && rng() < cfg.obsP){
      const newest = pool[pool.length - 1];
      t.obs = rng() < 0.35 ? newest : pool[Math.floor(rng() * pool.length)];
      sinceObs = 0;
    }
  }
  finishS = s;
  for (let k = 0; k < 5; k++){ const t = startRoad(L, k === 0 ? w : 3.6, 3.6, h, h, { finish: true }); t.style = 'candy'; t.color = k % 2 ? 0xffffff : 0xffe07a; }
  sMin = tiles[0].s0; sMax = s;

  // ---- 2. sample the centerline ----
  const N = Math.ceil((sMax - sMin) / DS) + 2;
  cX = new Float32Array(N); cZ = new Float32Array(N); cH = new Float32Array(N);
  let x = 0, z = -sMin, ti = 0;
  for (let k = 0; k < N; k++){
    const ss = sMin + k * DS;
    while (ti < tiles.length - 1 && ss >= tiles[ti].s0 + tiles[ti].len) ti++;
    const t = tiles[ti], u = clamp((ss - t.s0) / t.len, 0, 1);
    const hh = lerp(t.h0, t.h1, u);
    cX[k] = x; cZ[k] = z; cH[k] = hh;
    x += Math.sin(hh) * DS; z -= Math.cos(hh) * DS;
  }
  const c0 = centerAt(0); for (let k = 0; k < N; k++){ cX[k] -= c0.x; cZ[k] -= c0.z; }

  // ---- 3. special spots on plain tiles: checkpoint flag, power-ups, a friend to rescue ----
  const cand = tiles.filter(t => t.kind === 'road' && !t.start && !t.finish && !t.blink && !t.pad && !t.obs && !t.side && !t.wind && !t.beam && !t.afterGap && !t.hazardEnd && t.s0 > 30);
  const takeNear = frac => {
    if (!cand.length) return null;
    let best = 0, bd = 1e9;
    cand.forEach((t, i) => { const dd = Math.abs(t.s0 - finishS * frac); if (dd < bd){ bd = dd; best = i; } });
    return cand.splice(best, 1)[0];
  };
  if (opt.flag && cfg.tiles >= 60){ const t = takeNear(0.5); if (t){ t.flag = true; flagS = t.s0 + 2; } }
  if (opt.friend){ const t = takeNear(0.3 + rng() * 0.4); if (t) t.friend = FRIENDS[wi]; }
  if (cn >= 10){
    let cnt = (rng() < 0.6 ? 1 : 0) + (cn > 100 && rng() < 0.4 ? 1 : 0);
    if (isBoss) cnt = Math.max(cnt, 1);
    const kinds = Object.keys(POW);
    for (let k = 0; k < cnt; k++){ const t = takeNear(0.15 + rng() * 0.65); if (t) t.pow = kinds[Math.floor(rng() * kinds.length)]; }
  }

  // ---- 4. meshes ----
  totalApples = 0;
  let firstHeart = n % 3 === 0;
  const firstFinish = tiles.find(q => q.finish);
  tiles.forEach(t => {
    if (t.kind === 'road'){
      const geo = ribbonGeo(t.s0, t.s0 + t.len, t.w0, t.w1, TH);
      const mats = roadMats(t.style, t.color);
      if (t.blink){ mats[0] = mats[0].clone(); mats[0].transparent = true; mats[1] = mats[1].clone(); mats[1].transparent = true; }
      const m = new THREE.Mesh(geo, mats); m.userData.ownGeo = true; addObj(m); t.mesh = m;
      if (t.blink) blinkTiles.push(t);
      if (t.hazardEnd){
        const hz = new THREE.Mesh(ribbonGeo(t.s0 + t.len - 1.2, t.s0 + t.len, lerp(t.w0, t.w1, 0.7), t.w1, 0.02, 0.012), [hazardMat, hazardMat]);
        hz.userData.ownGeo = true; addObj(hz);
      }
      if (t === firstFinish) buildFinishArch(t);
      const wMid = (t.w0 + t.w1) / 2, sMid = t.s0 + t.len / 2;
      if (t.wind){
        const g = new THREE.Group();
        for (let k = 0; k < 3; k++){
          const a = new THREE.Mesh(G_('warrow', () => new THREE.ConeGeometry(0.18, 0.7, 6)), dm('warrow', () => basic(0xffffff, { transparent: true, opacity: 0.75 })));
          a.rotation.z = -t.wind * Math.PI / 2; a.position.set(0, 0.6, (k - 1) * 1.2); g.add(a);
        }
        place(g, sMid, 0, 0); addObj(g);
        winds.push({ g, dir: t.wind, width: wMid + 1.5 });
      }
      if (t.side){
        t.side.lat = t.side.dir * (Math.max(t.w0, t.w1) / 2 + 0.5 + t.side.w / 2);
        const sm = new THREE.Mesh(ribbonGeo(t.s0 + 0.4, t.s0 + t.len - 0.4, t.side.w, t.side.w, 0.3, 0, t.side.lat), roadMats('candy', 0xffd23a));
        sm.userData.ownGeo = true; addObj(sm);
        addPickup('gold', sMid, t.side.lat, 0.8);
      }
      if (t.flag){
        const old = new THREE.Group();
        const pole = new THREE.Mesh(G_('fgpole', () => new THREE.CylinderGeometry(0.05, 0.05, 2.2, 8)), dm('white', () => lam(0xffffff))); pole.position.y = 1.1; old.add(pole);
        const cloth = new THREE.Mesh(G_('fgcloth', () => new THREE.BoxGeometry(0.7, 0.45, 0.04)), dm('fgcloth', () => lam(0xff3a4a))); cloth.position.set(0.38, 1.9, 0); old.add(cloth);
        const fg = pictureFlag(2.2, old);
        place(fg, flagS, -(wMid / 2 + 0.2), 0); addObj(fg);
      }
      if (t.pow) addPickup('pow', sMid, 0, 0.9, null, t.pow);
      if (t.friend) addPickup('friend', sMid, 0, 0.8, null, t.friend);
      if (t.pad){
        const pk = clamp(wMid / 3, 0.6, 1);
        const ps = t.s0 + L * 0.5, pm = makePad(); pm.scale.setScalar(pk); place(pm, ps, t.pad.lat, 0); addObj(pm);
        pads.push({ s: ps, lat: t.pad.lat, mesh: pm, cool: 0, k: pk });
        const air = 2 * PAD_V / grav(), dist = cfg.speed * air;
        for (let k = 1; k <= 3; k++){
          const u = k / 4, ys = R + PAD_V * (u*air) - 0.5 * grav() * (u*air) * (u*air);
          addPickup(firstHeart && k === 2 ? 'heart' : 'apple', ps + dist * u, t.pad.lat, ys);
          if (firstHeart && k === 2) firstHeart = false;
        }
      }
      if (t.obs) addObstacle(t.obs, t, wi, rng);
      if (!t.start && !t.finish && !t.pad && !t.blink && !t.obs && !t.side && !t.pow && !t.friend && !t.beam && rng() < (isBoss ? 0.85 : 0.45)){
        const cnt = 1 + Math.floor(rng() * 3), off = (rng() - 0.5) * Math.max(0, wMid - 1);
        const ak = clamp(wMid / 3, 0.7, 1);
        for (let k = 0; k < cnt; k++) addPickup('apple', t.s0 + (k + 0.5) / cnt * t.len, off, 0.45 + 0.3 * ak, ak);
      }
    } else if (t.kind === 'mover'){
      const plat = new THREE.Mesh(G_('plat', () => new THREE.BoxGeometry(1.8, 0.4, 3)), lam(0xffcf3f));
      const edge = new THREE.Mesh(G_('platE', () => new THREE.BoxGeometry(1.84, 0.1, 3.04)), lam(0xff8fb1)); edge.position.y = 0.16; plat.add(edge);
      addObj(plat);
      movers.push({ t, mesh: plat, lat: 0, vel: 0 });
    }
  });
  buildDecor(rng);
  applyWorldLook();
}
function addPickup(type, s, lat, y, scale, kind){
  let m;
  if (type === 'heart') m = makeHeart();
  else if (type === 'pow') m = emojiSprite(POW[kind].icon, 0.95);
  else if (type === 'friend') m = emojiSprite(kind, 0.95);
  else { m = makeApple(type === 'gold'); if (type === 'gold') m.scale.setScalar(1.4); }
  if (scale) m.scale.setScalar(scale);
  place(m, s, lat, y); addObj(m);
  pickups.push({ type, kind, s, lat, y, mesh: m, taken: false, ph: Math.random() * 6, base: m.scale.x, popT: 0 });
  if (type === 'apple') totalApples++;
}
function addObstacle(type, t, wi, rng){
  const wMid = (t.w0 + t.w1) / 2, s = t.s0 + L * (0.4 + rng() * 0.2);
  const mesh = obstacleMesh(type, wi); addObj(mesh);
  // obstacles shrink with the road: full size on a 3-wide road, down to 55 % on narrow roads
  const k = clamp(wMid / 3, 0.55, 1);
  mesh.scale.setScalar(k);
  const o = { type, s, lat: 0, mesh, ph: rng() * 6, w: wMid, tile: t, k };
  if (type === 'static'){
    const free = wMid - 0.95 * k;               // room left beside an edge-placed obstacle
    o.lat = free >= 1.3 ? (rng() < 0.5 ? -1 : 1) * (wMid/2 - 0.48 * k) : 0; // else centre: jump over it
  }
  if (type === 'slider'){ o.amp = Math.max(0.2, wMid/2 - 0.45 * k); o.freq = 1.1 + rng() * 0.8 + cfg.d; }
  if (type === 'hammer'){ o.freq = 1.6 + rng() * 0.6 + cfg.d * 0.8; }
  if (type === 'spinner'){ o.freq = 1.6 + cfg.d * 1.4; o.half = Math.min(wMid / 2 + 0.2, 1.15); mesh.userData.bar.scale.x = o.half * 2 / k; }
  if (type === 'roller'){ o.lat = (rng() - 0.5) * Math.max(0, wMid - 1.3 * k); o.s0 = s; o.s = o.s0; o.active = false; o.speed = 3 + cfg.d * 2; }
  if (type === 'hopper'){ o.lat = (rng() - 0.5) * Math.max(0, wMid - 0.9 * k); o.freq = 1.6 + rng() * 0.6; }
  obstacles.push(o);
}
// waving picture flag (pole on the left stays still, the cloth ripples)
const flagGeo = new THREE.PlaneGeometry(ITEM.bayrak[0] / ITEM.bayrak[1], 1, 18, 1); flagGeo.translate(ITEM.bayrak[0] / ITEM.bayrak[1] / 2 - 0.12, 0.5, 0);

const input = { left: false, right: false, jumpBuf: 0, dragPx: 0 };
const TAP_MAX_MOVE = 12, TAP_MAX_TIME = 300;
const pointers = new Map();
const inGame = () => state === 'play';
window.addEventListener('pointerdown', e => {
  if (!inGame() || (e.target.closest && e.target.closest('button'))) return;
  e.preventDefault(); initAudio();
  pointers.set(e.pointerId, { x0: e.clientX, y0: e.clientY, last: e.clientX, t0: performance.now(), moved: false });
}, { passive: false });
window.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p || !inGame()) return;
  e.preventDefault();
  if (!p.moved && Math.hypot(e.clientX - p.x0, e.clientY - p.y0) > TAP_MAX_MOVE){ p.moved = true; p.last = p.x0; }
  if (p.moved){ input.dragPx += e.clientX - p.last; p.last = e.clientX; }
}, { passive: false });
function endPointer(e, cancelled){
  const p = pointers.get(e.pointerId);
  if (!p) return;
  pointers.delete(e.pointerId);
  if (!cancelled && inGame() && !p.moved && performance.now() - p.t0 < TAP_MAX_TIME) input.jumpBuf = 0.15;
}
window.addEventListener('pointerup', e => endPointer(e, false));
window.addEventListener('pointercancel', e => endPointer(e, true));
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (inGame()) e.preventDefault(); }, { passive: false });
window.addEventListener('keydown', e => {
  if (!inGame()) return;
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') input.left = true;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') input.right = true;
  if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W'){ e.preventDefault(); if (inGame()) input.jumpBuf = 0.15; }
});
window.addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') input.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') input.right = false;
});

  if (st >= 6) for (let k = 0; k < 5; k++){ const f = flower([0xff8fb1, 0xffffff, 0xc5a0ff, 0xff6a6a, 0xffd23a][k]); f.position.set(-1.6 + k * 0.5, 0.25, 1.5); f.scale.setScalar(0.8); g.add(f); }
  if (st >= 7){ const sg = new THREE.Mesh(G_('hstar', () => new THREE.OctahedronGeometry(0.25)), goldMat); sg.position.set(-0.2, 1.6, 0); g.add(sg); }
  g.add = gAdd;

    const hh = 1.7 + (st - 3) * 0.16, sp = itemSprite('yuva', hh, lodge);
    sp.center.set(0.5, 0.04); sp.position.set(-0.2, 0.2, 0.2); g.add(sp);

  }

}

// ---------- music (simple generated melody per world) ----------
const MUSIC = [
  [262, [0,2,4,7,9], 104], [220, [0,2,4,7,9], 96], [294, [0,2,4,7,9], 112], [247, [0,2,5,7,9], 100], [196, [0,2,4,7,9], 92],
  [233, [0,3,5,7,10], 116], [208, [0,1,4,5,7], 98], [262, [0,2,4,7,11], 90], [175, [0,3,5,7,10], 88], [165, [0,3,5,7,10], 120]
];
let musT = 0, musI = 0, musPat = null, musWi = -1;
function musNote(f, t, dur, type, vol){
  try {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.03);
  } catch(e){}
}
function musicTick(){
  if (!actx || muted || state !== 'play'){ musT = 0; return; }
  const wi = WORLDS.indexOf(world), M = MUSIC[wi];
  if (musWi !== wi || !musPat){
    musWi = wi; musPat = []; const r = mulberry32(wi * 97 + 5); let d = 2;
    for (let k = 0; k < 32; k++){ d = clamp(d + Math.floor(r() * 5) - 2, 0, 7); musPat.push(r() < 0.72 ? d : -1); }
  }
  const stepDur = 60 / M[2] / 2;
  if (musT < actx.currentTime) musT = actx.currentTime + 0.05;
  while (musT < actx.currentTime + 0.25){
    const d = musPat[musI % 32];
    if (d >= 0) musNote(M[0] * Math.pow(2, (M[1][d % 5] + 12 * Math.floor(d / 5)) / 12), musT, stepDur * 0.9, 'triangle', 0.04);
    if (musI % 8 === 0) musNote(M[0] / 2 * Math.pow(2, M[1][[0, 3, 0, 2][(musI / 8) % 4]] / 12), musT, stepDur * 3.5, 'sine', 0.05);
    musI++; musT += stepDur;
  }
}

function emitBubble(f){

const camFwd = new THREE.Vector3(), tmpV = new THREE.Vector3();
function behindCam(p, margin){ tmpV.subVectors(p, camera.position); return tmpV.dot(camFwd) < -(margin || 4) || tmpV.lengthSq() > 140 * 140; }
function updateFish(dt, t){

function updateParticles(dt){
  const cp = camera.position;
  if (stars.visible) stars.position.copy(cp);
  [snow, embers].forEach(P => {
    if (!P.visible) return;
    const a = P.geometry.attributes.position, arr = a.array, down = P === snow;
    for (let k = 0; k < arr.length; k += 3){

// play step (physics in track space: s along, lat sideways)
// =====================================================================
function groundAt(s, lat){
  const t = tileAt(s);
  if (!t || t.kind === 'gap') return null;
  if (t.kind === 'mover'){
    const mv = movers.find(m => m.t === t);
    const ls = s - t.s0;
    if (ls < t.g1 || ls > t.g1 + 3) return null;
    if (Math.abs(lat - mv.lat) > 0.9 + cfg.tol) return null;
    return { t, mover: mv };
  }
  if (t.blink && t.hidden) return null;
  const u = (s - t.s0) / t.len, w = lerp(t.w0, t.w1, u);
  if (Math.abs(lat) <= w / 2 + cfg.tol) return { t };
  if (t.side && s > t.s0 + 0.3 && s < t.s0 + t.len - 0.3 && Math.abs(lat - t.side.lat) <= t.side.w / 2 + cfg.tol + 0.1) return { t, side: true };
  return null;
}
function givePower(kind){
  if (kind === 'shield'){ power.shield = true; }
  else { power.kind = kind; power.t = POW[kind].t; }
  toast(POW[kind].icon + ' ' + POW[kind].name + '!', 1100);
  sfx.heart();
}

function stepPlay(dt){
  if (ball.wait > 0) ball.wait -= dt;
  const moving = ball.wait <= 0;
  ball.invuln = Math.max(0, ball.invuln - dt);
  if (power.kind){ power.t -= dt; if (power.t <= 0) power.kind = null; }
  updatePowHud();

  // smooth steering (ice is slippery)
  const tNow = tileAt(ball.s);
  const glide = tNow && tNow.style === 'ice' ? 3.5 : 10;
  const steer = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  ball.targetLat += input.dragPx * (6 / Math.max(320, window.innerWidth)) + steer * 6.5 * dt;
  input.dragPx = 0;
  if (tNow && tNow.wind && moving){ ball.targetLat += tNow.wind * 1.3 * dt; ball.lat += tNow.wind * 0.4 * dt; }
  ball.targetLat = clamp(ball.targetLat, ball.lat - 3.5, ball.lat + 3.5);
  const prevLat = ball.lat;
  if (!ball.falling) ball.lat = lerp(ball.lat, ball.targetLat, 1 - Math.exp(-glide * dt));
  if (ball.onMover && ball.grounded){ ball.lat += ball.onMover.vel * dt; ball.targetLat += ball.onMover.vel * dt; }
  const vlat = (ball.lat - prevLat) / Math.max(dt, 0.001);
  ball.rollV = lerp(ball.rollV, vlat, 1 - Math.exp(-12 * dt));

  input.jumpBuf = Math.max(0, input.jumpBuf - dt);
  if (moving && input.jumpBuf > 0 && !ball.falling && (ball.grounded || ball.coyote > 0)){
    ball.vy = JUMP_V; ball.grounded = false; ball.coyote = 0; input.jumpBuf = 0; sfx.jump();
  }

  if (moving) ball.s += ball.speed * dt;
  const g = grav() * (power.kind === 'wing' && ball.vy < 0 && !ball.falling ? 0.3 : 1);
  ball.vy -= g * dt;
  ball.y += ball.vy * dt;
  if (ball.falling) ball.lat += ball.rollV * dt * 0.5;

  const gr = groundAt(ball.s, ball.lat);
  if (!ball.falling && gr && ball.vy <= 0 && ball.y <= R && ball.y > R - 0.6){
    if (!ball.grounded && ball.vy < -4){ squashT = 0.22; squashAmt = clamp(-ball.vy / 60, 0.08, 0.22); }
    ball.y = R; ball.vy = 0; ball.grounded = true; ball.coyote = 0.12;
    ball.onMover = gr.mover || null;
    if (gr.t.kind === 'road' && !gr.t.blink && !gr.t.finish && !gr.t.beam && !gr.side) ball.checkpoint = gr.t.s0 + 0.3;
  } else {
    ball.grounded = false; ball.onMover = null;
    ball.coyote = Math.max(0, ball.coyote - dt);
    if (!ball.falling && ball.y < R - 0.6){ ball.falling = true; sfx.fall(); }
  }
  if (ball.y < -9){ loseLife(); return; }

  // roll the ball (axis follows the curve)
  const c = centerAt(ball.s);
  const right = tmpV.set(Math.cos(c.h), 0, Math.sin(c.h));
  if (moving) rollAng = (rollAng - ball.speed * dt / R * 0.7) % (Math.PI * 2);
  rollLean = lerp(rollLean, clamp(-ball.rollV * 0.08, -0.3, 0.3), 1 - Math.exp(-8 * dt));
  ballTurn(beaver.ball.quaternion, c.h);

  // checkpoint flag
  if (flagS && !flagHit && ball.s > flagS && ball.grounded){
    flagHit = true; flagApples = apples; sfx.heart(); writeSave();
    toast('🚩 Kontrol noktası!', 1100);
  }

  // trampolines
  pads.forEach(pd => {
    pd.cool = Math.max(0, pd.cool - dt);
    if (ball.grounded && pd.cool <= 0 && Math.abs(pd.s - ball.s) < 0.5 * pd.k + 0.3 && Math.abs(pd.lat - ball.lat) < 0.55 * pd.k + 0.3){
      ball.vy = PAD_V; ball.grounded = false; pd.cool = 1; sfx.pad();
      pd.mesh.userData.top.scale.y = 3;
    }
    pd.mesh.userData.top.scale.y = lerp(pd.mesh.userData.top.scale.y, 1, 1 - Math.exp(-8 * dt));
  });

  // pickups (the magnet pulls apples in)
  const reach = power.kind === 'giant' ? 1.4 : 0.9;
  pickups.forEach(pk => {
    if (pk.taken) return;
    const ds = pk.s - ball.s;
    if (power.kind === 'magnet' && (pk.type === 'apple' || pk.type === 'gold') && ds > -1 && ds < 9 && Math.abs(pk.lat - ball.lat) < 4.5){
      const k = 1 - Math.exp(-7 * dt);
      pk.lat = lerp(pk.lat, ball.lat, k); pk.y = lerp(pk.y, ball.y, k);
      if (ds < 4) pk.s = lerp(pk.s, ball.s + 0.3, k);
      place(pk.mesh, pk.s, pk.lat, pk.y);
    }
    if (Math.abs(ds) > 1.1) return;
    if (Math.abs(pk.lat - ball.lat) < reach && Math.abs(pk.y - ball.y) < reach){
      pk.taken = true; pk.popT = 0.28;
      if (pk.type === 'heart'){
        if (lives < MAX_LIVES){ lives++; toast('+1 can! ❤️', 1100); } else toast('Canların dolu! ❤️', 1000);
        sfx.heart(); burst(pk.mesh.position, 24, [0xff3a6a, 0xffffff, 0xff9ab8], 5);
      } else if (pk.type === 'pow'){
        givePower(pk.kind); burst(pk.mesh.position, 20, [0x7cd8ff, 0xffffff, 0xffe066], 5);
      } else if (pk.type === 'friend'){
        const sp = emojiSprite(pk.kind, 0.75); addObj(sp);
        follower = { m: sp, emoji: pk.kind, lat: ball.lat };
        sfx.heart(); toast(pk.kind + ' Bir arkadaş buldun!<br><span style="font-size:22px">Bitişe kadar götür!</span>', 1800);
      } else if (pk.type === 'gold'){
        bankAdd(10); sfx.heart(); burst(pk.mesh.position, 24, [0xffd23a, 0xffffff], 6); toast('Altın para! +10 🍎', 1200);
      } else {
        apples++; bankAdd(1); sfx.apple(); burst(pk.mesh.position, 14, [0xffe066, 0xff6b6b, 0xffffff], 4);
        if (boss.active) boss.s -= 1.5;
      }
      updateHud();
    }
  });

  // obstacles
  if (!ball.falling){
    for (const o of obstacles){
      if (o.dead || Math.abs(o.s - ball.s) > 3) continue;
      if (!obstacleHit(o)) continue;
      if (power.kind === 'giant'){ o.dead = true; o.mesh.visible = false; burst(o.mesh.position, 18, [0xffffff, 0xffcf3f, 0xff8fb1], 7); sfx.bonk(); continue; }
      if (ball.invuln > 0) continue;
      if (power.shield){ power.shield = false; ball.invuln = 1.2; sfx.bonk(); burst(ballWorld, 20, [0x7cd8ff, 0xffffff], 6); toast('Kalkan seni korudu! 🛡️', 1000); break; }

  // boss chaser: creeps closer, every apple pushes it back

    if (boss.s > ball.s - 2.6 && !ball.falling){
      sfx.bonk(); toast('Yakalandın!', 900);
      loseLife(); if (state !== 'play') return;
    }
  }

  if (mode === 'endless'){ const m = Math.floor(endless.base + Math.max(0, ball.s)); if (m !== lastM){ lastM = m; $('hLevel').textContent = '∞ ' + m + ' m'; } }

  }

}

function obstacleHit(o){
  const ds = Math.abs(o.s - ball.s), dl = Math.abs(o.curLat - ball.lat), y = ball.y, k = o.k;
  switch (o.type){
    case 'static':  return ds < 0.44*k + 0.33 && dl < 0.44*k + 0.36 && y < 0.6*k + 0.45;
    case 'slider':  return ds < 0.45*k + 0.35 && dl < 0.45*k + 0.38 && y < 0.8*k + 0.45;
    case 'roller':  return ds < 0.45*k + 0.38 && dl < 0.65*k + 0.38 && y < 0.9*k + 0.45;
    case 'hammer':  return ds < 0.35*k + 0.38 && dl < 0.45*k + 0.35 && Math.abs(y - o.headY) < 0.35*k + 0.45;
    case 'hopper':  return ds < 0.42*k + 0.35 && dl < 0.42*k + 0.38 && Math.abs(y - o.hy) < 0.42*k + 0.45;
    case 'spinner': {
      if (y > 0.43*k + 0.5) return false;
      // distance from ball to the rotating bar (in track plane)
      const a = o.ang, bx = Math.cos(a), bz = -Math.sin(a);
      const px = ball.lat - 0, pz = ball.s - o.s;
      const proj = clamp(px * bx + pz * bz, -o.half, o.half);
      return Math.hypot(px - proj * bx, pz - proj * bz) < 0.11*k + 0.36;
    }
  }
  return false;
}

function updateLevelObjects(dt){
  // obstacles
  obstacles.forEach(o => {
    const t = time;
    o.curLat = o.lat;
    if (o.type === 'slider'){ o.curLat = Math.sin(t * o.freq + o.ph) * o.amp; place(o.mesh, o.s, o.curLat, 0); }
    else if (o.type === 'hammer'){
      const ang = Math.sin(t * o.freq + o.ph) * 1.0;
      place(o.mesh, o.s, 0, 3.4 * o.k);
      o.mesh.userData.arm.rotation.z = ang;
      o.curLat = Math.sin(ang) * 2.5 * o.k; o.headY = (3.4 - Math.cos(ang) * 2.5) * o.k;
    } else if (o.type === 'spinner'){
      o.ang = t * o.freq + o.ph;
      place(o.mesh, o.s, 0, 0);
      o.mesh.userData.bar.rotation.y = -o.ang;
      o.curLat = 0;
    } else if (o.type === 'roller'){
      if (!o.active && state === 'play' && o.s0 - ball.s < 20) o.active = true;
      if (o.active && state === 'play') o.s -= o.speed * dt;
      if (o.s < ball.s - 10) o.s = -1000;
      place(o.mesh, o.s, o.lat, 0);
      o.mesh.userData.spin.rotation.x += o.speed * dt / 0.45 * (o.active ? 1 : 0);
      o.mesh.visible = o.s > -999 && !o.dead;
    } else if (o.type === 'hopper'){
      o.hy = 0.42 * o.k + 2.4 * Math.abs(Math.sin(t * o.freq * 0.8 + o.ph));
      place(o.mesh, o.s, o.lat, o.hy);
    } else if (!o.placed){ place(o.mesh, o.s, o.lat, 0); o.placed = true; }
  });
  // moving platforms
  movers.forEach(m => {
    const prev = m.lat;
    m.lat = Math.sin(time * m.t.freq + m.t.ph) * m.t.amp;
    m.vel = (m.lat - prev) / Math.max(dt, 0.001);
    place(m.mesh, m.t.s0 + m.t.g1 + 1.5, m.lat, -0.2);
  });
  // blinking tiles: visible 70% of a 2.2 s cycle, flashing before they vanish
  blinkTiles.forEach(t => {
    const ph = (time / 2.2 + t.ph) % 1;
    t.hidden = ph > 0.7;
    const warn = ph > 0.55 && ph <= 0.7;
    t.mesh.visible = !t.hidden;
    const op = warn ? (Math.floor(time * 12) % 2 ? 0.35 : 0.9) : 1;
    t.mesh.material[0].opacity = op * (t.style === 'glass' ? 0.55 : 1);
    t.mesh.material[1].opacity = op;
  });
  // pickups bob
  pickups.forEach(pk => {
    const sp = pk.mesh.userData.sp;
    if (pk.taken){
      if (pk.popT > 0){   // hop up, grow a little and fade
        pk.popT -= dt; const k = 1 - Math.max(0, pk.popT) / 0.28;
        pk.mesh.position.y = pk.y + Math.sin(k * Math.PI * 0.5) * 0.9;
        pk.mesh.scale.setScalar(pk.base * (1 + k * 0.5));
        pk.mesh.traverse(o => { if (o.material && o.material.transparent !== undefined && o.isSprite){ o.material.opacity = 1 - k * k; } });
        if (pk.popT <= 0) pk.mesh.visible = false;
      }
      return;
    }
    pk.mesh.rotation.y += dt * 2;
    pk.mesh.position.y = pk.y + Math.sin(time * 3 + pk.ph) * 0.1;
    if (sp){
      const t = time * 2.2 + pk.ph, h = sp.userData.h;
      if (sp.userData.k === 'altin'){ sp.scale.x = h * ITEM.altin[0] / ITEM.altin[1] * (0.3 + 0.7 * Math.abs(Math.cos(t))); }   // coin turns round
      else if (sp.userData.k === 'kalp'){ const b = 1 + Math.max(0, Math.sin(t * 2.4)) * 0.1; sp.scale.set(h * ITEM.kalp[0] / ITEM.kalp[1] * b, h * b, 1); }   // heart beats
      else sp.material.rotation = Math.sin(t) * 0.14;   // apple sways
    }
  });
  winds.forEach(w => w.g.children.forEach((a, i) => { a.position.x = (((time * 0.9 + i / 3) % 1) - 0.5) * w.dir * w.width; }));
  decorAnims.forEach(fn => fn(time));
  waveFlags(time);
  if (world.decor === 'volcano' && groundMesh.material.color){ groundMesh.material.color.setHSL(0.06, 1, 0.5 + Math.sin(time * 1.5) * 0.06); }
}

const camTarget = new THREE.Vector3(), lookTarget = new THREE.Vector3(), lookCur = new THREE.Vector3();
function step(dt){
  time += dt;
  updateForm(dt);
  if (state === 'play'){ save.sec = (save.sec || 0) + dt; secAcc += dt; if (secAcc > 20){ secAcc = 0; rollDay(); writeSave(); } }
  musicTick();
  const c = centerAt(ball.s);

  if (state === 'play'){
    stepPlay(dt);
    beaver.stand.rotation.y = -c.h;
  } else if (state === 'win'){
    winT += dt;
    ball.speed = Math.max(0, ball.speed - 16 * dt);
    ball.s += ball.speed * dt;
    ball.lat = lerp(ball.lat, 0, 1 - Math.exp(-3 * dt));
    beaver.root.visible = true;
    beaver.stand.rotation.y = lerp(beaver.stand.rotation.y, -c.h + Math.PI, 1 - Math.exp(-5 * dt));
    ball.y = R + Math.abs(Math.sin(winT * 6)) * 0.35 * (winT > 0.3 ? 1 : 0);
    beaver.armR.rotation.z = 2.6 + Math.sin(winT * 10) * 0.4;
    beaver.armL.rotation.z = -2.6 - Math.sin(winT * 10) * 0.4;
    celebrateT -= dt;
    if (celebrateT <= 0 && winT < 3){ celebrateT = 0.5; burst(worldAt(ball.s + 0.5, (Math.random()-0.5)*2, 1.5), 18, [0xffe066, 0xff6b6b, 0x7cc4ff, 0x7fd8a8], 5); }
  } else if (state === 'lose'){
    beaver.root.visible = false;
  } else {
    menuT += dt;
    beaver.root.visible = true;
    beaver.stand.rotation.y = -c.h + Math.PI;
    ball.y = R;
    beaver.armR.rotation.z = 2.5 + Math.sin(menuT * 6) * 0.45;
    beaver.armL.rotation.z = -0.35;
  }
  if (state !== 'win' && state !== 'menu'){ beaver.armR.rotation.z = 0.35; beaver.armL.rotation.z = -0.35; }

  worldAt(ball.s, ball.lat, ball.y, ballWorld);
  beaver.root.position.copy(ballWorld);
  if (accS && accS.userData.spin){ accS.userData.spin.rotation.y += dt * 14; if (accB.userData.spin) accB.userData.spin.rotation.y += dt * 14; }
  if (save.wear.fur === 'rainbow'){ const c = tmpCol.setHSL((time * 0.15) % 1, 0.75, 0.6); furMats.forEach(m => m.color.copy(c)); furDark.forEach(m => m.color.copy(c).multiplyScalar(0.72)); }
  if (trailItem && state === 'play' && ball.grounded && ball.wait <= 0){
    trailT -= dt;
    if (trailT <= 0){ trailT = 0.045;
      const m = new THREE.Mesh(sparkGeo, basic(trailItem.colors[Math.floor(Math.random() * trailItem.colors.length)], { transparent: true }));
      m.position.set(ballWorld.x + (Math.random() - 0.5) * 0.4, 0.12 + Math.random() * 0.25, ballWorld.z + (Math.random() - 0.5) * 0.4); m.scale.setScalar(1.6);
      scene.add(m); sparks.push({ m, v: new THREE.Vector3((Math.random() - 0.5) * 0.6, 2.2, (Math.random() - 0.5) * 0.6), life: 0.7 }); }
  }
  gScale = lerp(gScale, power.kind === 'giant' && state === 'play' ? 1.7 : 1, 1 - Math.exp(-6 * dt));
  beaver.root.scale.setScalar(gScale); beaver.root.position.y += (gScale - 1) * R;
  shieldMesh.visible = power.shield && state === 'play';
  if (boss.active && boss.mesh){ place(boss.mesh, boss.s, 0, 2.0); boss.ballMesh.rotation.x -= dt * 4; boss.mesh.visible = state === 'play' || state === 'lose'; }
  if (follower){ follower.lat = lerp(follower.lat, ball.lat, 1 - Math.exp(-4 * dt)); place(follower.m, ball.s - 1.3, follower.lat, 0.45 + Math.abs(Math.sin(time * 8)) * 0.25); }
  squashT = Math.max(0, squashT - dt);
  const sq = squashT > 0 ? Math.sin((1 - squashT / 0.22) * Math.PI) * squashAmt : 0;
  const bob = state === 'play' && ball.grounded && ball.wait <= 0 ? Math.abs(Math.sin(ball.s * 2.2)) * 0.025 : 0;
  beaver.squash.scale.set(1 + sq * 0.5, 1 - sq, 1 + sq * 0.5);
  beaver.squash.position.y = -sq * R + bob;
  updateBeaverPic(dt, c.h);
  updateArt(dt, c.h);

  // shadow
  const gr = cX ? groundAt(ball.s, ball.lat) : null;
  if (beaver.root.visible && gr && ball.y > -0.2){
    shadow.visible = true;
    const sc = 1 / (1 + Math.max(0, ball.y - R) * 0.6);
    shadow.scale.setScalar(sc); shadow.material.opacity = 0.25 * sc;
    shadow.position.set(ballWorld.x, gr.mover ? 0.02 : 0.01, ballWorld.z);
  } else shadow.visible = false;

  updateLevelObjects(dt);

  // sparks
  for (let k = sparks.length - 1; k >= 0; k--){
    const sp = sparks[k];
    sp.life -= dt; sp.v.y -= 9 * dt;
    sp.m.position.addScaledVector(sp.v, dt);
    sp.m.material.opacity = Math.max(0, sp.life / 0.9);
    if (sp.life <= 0){ scene.remove(sp.m); sp.m.material.dispose(); sparks.splice(k, 1); }
  }

  // camera (follows the curve)
  const f = 1 - Math.exp(-4.5 * dt);
  if (state === 'menu' || state === 'win'){
    worldAt(ball.s - (state === 'menu' ? 3.9 : 3.1), ball.lat + 0.9, 1.45, camTarget);
    worldAt(ball.s, ball.lat, state === 'menu' ? 0.2 : 0.75, lookTarget);
  } else if (state === 'play' && !ball.falling){
    worldAt(ball.s - 7, ball.lat * 0.85, 3.4 + Math.max(0, ball.y - R) * 0.35, camTarget);
    worldAt(ball.s + 5, ball.lat * 0.9, 0.3, lookTarget);
  } else {
    if (state === 'play') worldAt(ball.s - 6, ball.lat * 0.85, 3.6, camTarget);   // falling: stay above the road, keep up with the curve
    lookTarget.set(ballWorld.x, Math.max(ballWorld.y, -4), ballWorld.z);
  }
  if (state !== 'lose') camera.position.lerp(camTarget, state === 'play' && ball.falling ? f * 0.5 : f);
  lookCur.lerp(lookTarget, f);
  camera.lookAt(lookCur);
  camera.getWorldDirection(camFwd);

  updateFish(dt, time);
  clouds.forEach(cl => { if (cl.visible && behindCam(cl.position, 15)) placeCloud(cl, true); });
  updateParticles(dt);
  if (groundMesh.visible){ groundMesh.position.x = camera.position.x; groundMesh.position.z = camera.position.z; }
}

// =====================================================================
// start
// =====================================================================
goMenu();
worldAt(ball.s - 3.1, 0.9, 1.45, camera.position);
worldAt(ball.s, 0, 0.75, lookCur);
let last = performance.now(), lastState = '';
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (state === 'count'){
    countT -= dt; const n = Math.ceil(countT);
    if (n !== lastCount && n > 0){ lastCount = n; toast(String(n), 700); tone(660, 660, 0.08, 'triangle', 0.08); }
    if (countT <= 0) state = 'play';
  } else if (state !== 'pause') step(dt);
  if (state !== lastState){ lastState = state; $('pauseBtn').classList.toggle('hidden', state !== 'play' && state !== 'count'); }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

if ('serviceWorker' in navigator && location.protocol === 'https:'){
  try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch(e){}
}
})();
</script>
